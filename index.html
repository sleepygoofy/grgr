// ═══ AUTH ═══
function switchAuthTab(t,el){
  document.querySelectorAll('.auth-tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('auth-login').style.display=t==='login'?'':'none';
  document.getElementById('auth-signup').style.display=t==='signup'?'':'none';
  setMsg('');
}
async function doLogin(){
  const user=document.getElementById('login-user').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!user||!pass){setMsg('Username and password required');return;}
  setMsg('Starting engine...','');
  try{
    const snap=await db.collection('profiles').where('username','==',user).limit(1).get();
    if(snap.empty){setMsg('No account found with that username');return;}
    const prof=snap.docs[0].data();
    if(prof.is_banned){setMsg('Account suspended: '+(prof.ban_reason||'Contact support'));return;}
    if(prof.is_npc){setMsg('That is an NPC account');return;}
    await auth.signInWithEmailAndPassword(prof.email,pass);
  }catch(e){setMsg(e.message);}
}
async function doSignup(){
  const username=document.getElementById('su-user').value.trim();
  const email=document.getElementById('su-email').value.trim();
  const pass=document.getElementById('su-pass').value;
  if(!username||!email||!pass){setMsg('All fields required');return;}
  if(pass.length<6){setMsg('Password must be 6+ characters');return;}
  if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){setMsg('Username: 3-20 chars, letters/numbers/_ only');return;}
  setMsg('Building your profile...','');
  try{
    const taken=await db.collection('profiles').where('username','==',username).limit(1).get();
    if(!taken.empty){setMsg('Username already taken');return;}
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    const uid=cred.user.uid;
    await db.collection('profiles').doc(uid).set({uid,username,email,cash:50000,level:1,xp:0,wins:0,losses:0,win_streak:0,best_win_streak:0,reputation:0,role:'player',is_banned:false,ban_reason:null,is_npc:false,daily_streak:0,last_daily:null,achievements:[],created_at:firebase.firestore.FieldValue.serverTimestamp()});
    await giveStarterCar(uid);
    setMsg('Welcome to REDLINE! 🏎️','ok');
  }catch(e){setMsg(e.message);}
}
function setMsg(msg,type='err'){
  const el=document.getElementById('auth-msg');
  el.textContent=msg;el.style.display=msg?'block':'none';
  el.className='auth-msg'+(type==='ok'?' ok':type===''?' ':' err');
}
async function doLogout(){
  try{await logActivity('logout',{});}catch{}
  await auth.signOut();
}

    auctUnsubs.forEach(u=>u());auctUnsubs=[];
    clearInterval(window._mktTick);clearInterval(window._auctTick);clearInterval(window._cdTick);clearInterval(window._npcTick);
  }
});

// ═══ INIT ═══
async function initGame(){
  allCars=CAR_DATA;
  await Promise.all([loadProfile(),ensureMarketSeeded()]);
  await Promise.all([loadPlayerCars(),loadMarketPrices()]);
  renderHUD();renderRaceEvents();renderPlayerCars();
  setupAuctionListener();startMarketTicker();checkDailyBonus();
  startNPCEngine();
  checkAchievements();
  logActivity('login',{}).catch(()=>{});
}
async function loadProfile(){
  const doc=await db.collection('profiles').doc(currentUser.uid).get();
  if(doc.exists){profile={id:currentUser.uid,...doc.data()};}
  else{
    const username=currentUser.email.split('@')[0];
    profile={id:currentUser.uid,username,email:currentUser.email,cash:50000,level:1,xp:0,wins:0,losses:0,win_streak:0,best_win_streak:0,reputation:0,role:'player',is_banned:false,is_npc:false,daily_streak:0,last_daily:null,achievements:[]};
    await db.collection('profiles').doc(currentUser.uid).set(profile);
  }
}
async function loadPlayerCars(){
  const snap=await db.collection('player_cars').where('player_id','==',currentUser.uid).get();
  playerCars=snap.docs.map(d=>({id:d.id,...d.data()}));
  playerCars.forEach(pc=>{pc.car=allCars.find(c=>c.name===pc.car_name)||null;});
}
async function loadMarketPrices(){
  const snap=await db.collection('market_prices').get();
  marketPrices={};
  snap.docs.forEach(d=>{const mp=d.data();marketPrices[mp.car_name]={id:d.id,...mp};});
  allCars.forEach(c=>{if(!marketPrices[c.name])marketPrices[c.name]={car_name:c.name,current_price:c.base_price,base_price:c.base_price,demand_score:50};});
}
async function ensureMarketSeeded(){
  const snap=await db.collection('market_prices').limit(1).get();
  if(!snap.empty)return;
  const batch=db.batch();
  CAR_DATA.forEach(c=>{batch.set(db.collection('market_prices').doc(),{car_name:c.name,current_price:c.base_price,base_price:c.base_price,demand_score:50,sales_last_24h:0,updated_at:firebase.firestore.FieldValue.serverTimestamp()});});
  await batch.commit();
}
async function giveStarterCar(uid){

// ═══ DAILY BONUS ═══
async function checkDailyBonus(){
  if(!profile)return;
  const last=profile.last_daily?.toDate?.()??null;
  const now=new Date();
  if(last&&last.toDateString()===now.toDateString())return;
  showDailyBonus();
}
function showDailyBonus(){
  if(!profile)return;
  const streak=Math.min((profile.daily_streak||0),DAILY_AMOUNTS.length-1);
  const amount=DAILY_AMOUNTS[streak];
  document.getElementById('daily-amount').textContent='$'+fmtCashFull(amount);
  document.getElementById('daily-streak').textContent=`Day ${streak+1} streak · Come back tomorrow to continue!`;
  // render day dots
  const days=['M','T','W','T','F','S','S'];
  document.getElementById('daily-days').innerHTML=days.map((d,i)=>`<div class="daily-day ${i<streak?'done':i===streak?'today':''}">${i<streak?'✓':d}</div>`).join('');
  document.getElementById('daily-banner').classList.add('show');
}
async function claimDaily(){
  if(!profile||!currentUser)return;
  const last=profile.last_daily?.toDate?.()??null;
  const now=new Date();
  if(last&&last.toDateString()===now.toDateString()){
    toast('Already claimed today!','t-info');
    document.getElementById('daily-banner').classList.remove('show');return;
  }
  const yesterday=new Date(now-86400000);
  const newStreak=(last&&last.toDateString()===yesterday.toDateString())?(profile.daily_streak||0)+1:1;
  const idx=Math.min(newStreak-1,DAILY_AMOUNTS.length-1);
  const amount=DAILY_AMOUNTS[idx];
  const newCash=profile.cash+amount;
  await db.collection('profiles').doc(currentUser.uid).update({cash:newCash,daily_streak:newStreak,last_daily:firebase.firestore.Timestamp.now()});
  profile.cash=newCash;profile.daily_streak=newStreak;
  document.getElementById('daily-banner').classList.remove('show');
  renderHUD();
  logActivity('daily_bonus',{amount,streak:newStreak}).catch(()=>{});
  toast(`🎁 Daily bonus: +$${fmtCashFull(amount)}!`,'t-success');
  showXpPop('+$'+fmtCash(amount));
  checkAchievements();
}

function renderMarket(){
  const grid=document.getElementById('market-grid');
  const q=(document.getElementById('mkt-search')?.value||'').toLowerCase();

  let filtered=allCars.filter(c=>(currentMktFilter==='all'||c.class===currentMktFilter)&&(!q||c.name.toLowerCase().includes(q)||c.brand.toLowerCase().includes(q)));
  const getPrice=c=>marketPrices[c.name]?.current_price||c.base_price;
  if(sort==='price_asc')filtered.sort((a,b)=>getPrice(a)-getPrice(b));
  else if(sort==='price_desc')filtered.sort((a,b)=>getPrice(b)-getPrice(a));
  else if(sort==='power')filtered.sort((a,b)=>b.power-a.power);
  else if(sort==='speed')filtered.sort((a,b)=>b.top_speed-a.top_speed);
  else filtered.sort((a,b)=>(marketPrices[b.name]?.demand_score||50)-(marketPrices[a.name]?.demand_score||50));
  if(!filtered.length){grid.innerHTML='<div class="empty">No cars match your search.</div>';return;}

    const mp=marketPrices[c.name]||{};
    const price=mp.current_price||c.base_price;
    const delta=price-(mp.base_price||c.base_price);
    const dpct=Math.abs((delta/(mp.base_price||c.base_price))*100).toFixed(1);
    const dem=mp.demand_score||50;
    const dc=dem>70?'var(--red2)':dem>45?'var(--amber2)':'var(--green2)';
    const isOwned=owned.has(c.name);
    const canAfford=profile.cash>=price;
    return `<div class="car-card" onclick="viewCar('${c.name}')">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span class="badge ${rcls(c.rarity)}">${c.rarity}</span>
        <span class="badge badge-steel" style="font-size:8px">${c.class}</span>
      </div>
      <div class="car-emoji">${c.emoji}</div>
      <div class="car-name">${c.name}</div>
      <div class="car-brand">${c.brand}</div>
      <div style="font-size:11px;color:var(--text2);margin:4px 0 6px;line-height:1.4">${c.description}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3)">⚡<span style="color:var(--steel2)">${c.power}hp</span></span>
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3)">🏎️<span style="color:var(--steel2)">${c.top_speed}mph</span></span>
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3)">🎯<span style="color:var(--steel2)">${c.handling}</span></span>
      </div>
      <div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--text3);margin-bottom:3px"><span>DEMAND</span><span style="color:${dc}">${Math.round(dem)}/100</span></div>
        <div style="height:3px;background:var(--bg3);border-radius:2px"><div style="height:100%;width:${dem}%;background:${dc};border-radius:2px;transition:width .5s"></div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px">
        <div>
          <div style="font-family:var(--disp);font-size:18px;font-weight:700;color:${canAfford||isOwned?'var(--amber2)':'#884444'}">$${fmtCash(price)}</div>
          <div class="${delta>0?'delta-up':delta<0?'delta-down':''}" style="font-size:9px;font-family:var(--mono)">${delta>0?'▲ +'+dpct+'%':delta<0?'▼ '+dpct+'%':'— base'}</div>
        </div>
        ${isOwned?'<span class="badge badge-green">✓ OWNED</span>':canAfford?`<button class="btn btn-red btn-sm" onclick="event.stopPropagation();buyCar('${c.name}',${price})">Buy</button>`:`<span style="font-family:var(--mono);font-size:9px;color:var(--text3)">Not enough</span>`}
      </div>
      <div class="rarity-strip rarity-${c.rarity.toLowerCase()}"></div>
    </div>`;
  }).join('');
}

function startMarketTicker(){

function updateTicker(){
  const items=Object.values(marketPrices).slice(0,18).map(mp=>{
    const b=mp.base_price||10000,c=mp.current_price||b,d=c-b;
    const col=d>=0?'var(--green2)':'var(--red2)',dir=d>=0?'▲':'▼';
    return `<span style="margin-right:32px"><span style="color:${col}">${dir}</span> <span style="color:var(--steel2)">${mp.car_name}</span> <span style="color:var(--amber2)">$${fmtCash(c)}</span> <span style="color:${col};font-size:9px">${dir}${Math.abs((d/b)*100).toFixed(1)}%</span></span>`;
  }).join('');
  const el=document.getElementById('ticker-text');
  if(el&&items)el.innerHTML=items+items;
}
async function runMarketTick(){
  const batch=db.batch();let cnt=0;
  Object.values(marketPrices).forEach(mp=>{
    const dem=mp.demand_score||50;
    const push=(dem-50)*0.001,walk=(Math.random()-0.495)*0.008,decay=(mp.base_price-mp.current_price)*0.02;
    const newP=Math.max(Math.round(mp.base_price*0.3),Math.round(mp.current_price*(1+push+walk)+decay));
    const newD=Math.max(10,Math.min(100,dem+(Math.random()*4-2)));
    marketPrices[mp.car_name]={...mp,current_price:newP,demand_score:newD};
    if(mp.id&&cnt<10){batch.update(db.collection('market_prices').doc(mp.id),{current_price:newP,demand_score:Math.round(newD),updated_at:firebase.firestore.FieldValue.serverTimestamp()});cnt++;}
  });
  batch.commit().catch(()=>{});
  updateTicker();
  if(document.getElementById('tab-market').classList.contains('active'))renderMarket();
}

async function seedNPCAuctions(){
  if(!currentUser)return;
  const snap=await db.collection('auctions').where('status','==','active').get();
  const now=new Date();
  const active=snap.docs.filter(d=>{const t=d.data().ends_at?.toDate?.();return t&&t>now;});
  const need=Math.max(0,12-active.length);
  if(!need)return;
  const tmpls=[
    {rarities:['Common','Rare'],events:['standard'],durH:[2,4,6],sp:.55,bp:.95},
    {rarities:['Epic'],events:['standard'],durH:[4,6],sp:.6,bp:1.0},
    {rarities:['Legendary','Mythic'],events:['hypercar'],durH:[8,12],sp:.65,bp:1.1},
    {rarities:['Common','Rare'],events:['jdm_night'],durH:[2,4],sp:.5,bp:.9},
    {rarities:['Common','Rare','Epic'],events:['muscle_madness'],durH:[3,5],sp:.52,bp:.92},
  ];
  const batch=db.batch();
  for(let i=0;i<need;i++){
    const tmpl=tmpls[Math.floor(Math.random()*tmpls.length)];
    const cands=CAR_DATA.filter(c=>tmpl.rarities.includes(c.rarity));
    if(!cands.length)continue;
    const car=cands[Math.floor(Math.random()*cands.length)];
    const evt=tmpl.events[Math.floor(Math.random()*tmpl.events.length)];
    const dur=tmpl.durH[Math.floor(Math.random()*tmpl.durH.length)];
    const endsAt=new Date(Date.now()+dur*3600000+Math.random()*3600000);
    const base=(marketPrices[car.name]?.current_price||car.base_price);
    const npc=NPC_NAMES[Math.floor(Math.random()*NPC_NAMES.length)];
    batch.set(db.collection('auctions').doc(),{seller_id:currentUser.uid,seller_username:npc+' (NPC)',car_name:car.name,car_emoji:car.emoji,car_class:car.class,car_rarity:car.rarity,event_type:evt,starting_price:Math.round(base*tmpl.sp),current_price:Math.round(base*tmpl.sp),buyout_price:Math.round(base*tmpl.bp),highest_bidder_id:null,highest_bidder_username:null,bid_count:0,status:'active',ends_at:firebase.firestore.Timestamp.fromDate(endsAt),created_at:firebase.firestore.FieldValue.serverTimestamp()});
  }
  await batch.commit().catch(()=>{});
}
async function renderAuctions(){
  const grid=document.getElementById('auction-grid');
  try{
    const snap=await db.collection('auctions').where('status','==','active').get();
    const now=new Date();
    let auctions=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(a=>{const t=a.ends_at?.toDate?.();return t&&t>now;})
      .sort((a,b)=>a.ends_at.toDate()-b.ends_at.toDate());
    if(currentAuctFilter==='ending_soon'){
      auctions=auctions.filter(a=>(a.ends_at.toDate()-now)<7200000);
    } else if(currentAuctFilter!=='all'){
      auctions=auctions.filter(a=>a.event_type===currentAuctFilter);
    }
    if(!auctions.length){

        <div class="car-brand" style="margin-bottom:10px">Listed by <span style="color:var(--text2)">${a.seller_username||'?'}</span></div>

async function submitBid(){
  if(!currentBidAuction)return;
  const amount=parseInt(document.getElementById('bid-input').value);
  if(!amount||amount<=0){toast('Enter a valid amount','t-error');return;}
  if(amount<=currentBidAuction.current_price){toast(`Must exceed $${fmtCash(currentBidAuction.current_price)}`,'t-error');return;}
  if(profile.cash<amount){toast('Not enough cash!','t-error');return;}
  if(currentBidAuction.seller_id===currentUser.uid){toast("Can't bid on your own listing",'t-error');return;}
  // Refund previous bidder
  if(currentBidAuction.highest_bidder_id&&currentBidAuction.highest_bidder_id!==currentUser.uid)
    db.collection('profiles').doc(currentBidAuction.highest_bidder_id).update({cash:firebase.firestore.FieldValue.increment(currentBidAuction.current_price)}).catch(()=>{});
  await db.collection('profiles').doc(currentUser.uid).update({cash:firebase.firestore.FieldValue.increment(-amount)});
  profile.cash-=amount;
  await db.collection('auctions').doc(currentBidAuction.id).update({current_price:amount,highest_bidder_id:currentUser.uid,highest_bidder_username:profile.username,bid_count:firebase.firestore.FieldValue.increment(1)});
  await db.collection('auctions').doc(currentBidAuction.id).collection('bids').add({bidder_id:currentUser.uid,bidder_username:profile.username,amount,created_at:firebase.firestore.FieldValue.serverTimestamp()});
  closeModal('modal-bid');renderHUD();
  logActivity('bid',{car:currentBidAuction.car_name,amount}).catch(()=>{});
  toast(`Bid placed: $${fmtCash(amount)} 🎯`,'t-success');
  renderAuctions();
}
async function buyoutAuction(aId,price,carName,carEmoji,sellerId){
  if(!confirm(`Buy out for $${fmtCash(price)}?`))return;
  if(profile.cash<price){toast('Not enough cash!','t-error');return;}
  // Refund previous bidder
  const doc=await db.collection('auctions').doc(aId).get();
  const a=doc.data();
  if(a.highest_bidder_id&&a.highest_bidder_id!==currentUser.uid)
    db.collection('profiles').doc(a.highest_bidder_id).update({cash:firebase.firestore.FieldValue.increment(a.current_price)}).catch(()=>{});
  await db.collection('profiles').doc(currentUser.uid).update({cash:firebase.firestore.FieldValue.increment(-price)});
  const fee=Math.round(price*0.05);
  await db.collection('profiles').doc(sellerId).update({cash:firebase.firestore.FieldValue.increment(price-fee)}).catch(()=>{});
  await db.collection('auctions').doc(aId).update({status:'sold',current_price:price});
  // Give car
  const car=allCars.find(c=>c.name===carName)||{};
  await db.collection('player_cars').add({player_id:currentUser.uid,car_name:carName,car_class:car.class||'',car_emoji:carEmoji||'🚗',purchase_price:price,is_active:false,is_favorite:false,power_boost:0,handling_boost:0,speed_boost:0,upgrades:{},acquired_at:firebase.firestore.FieldValue.serverTimestamp()});
  profile.cash-=price;
  await loadPlayerCars();renderHUD();renderAuctions();
  logActivity('buyout',{car:carName,price}).catch(()=>{});
  toast(`🏆 ${carName} bought out! Added to garage.`,'t-success');
  checkAchievements();
}

const RACE_TIPS={drag:'More HP + Turbo upgrades win drags.',circuit:'Handling + HP = circuit king.',street:'Acceleration upgrades are key.',highway:'Max power and top speed builds.',offroad:'SUV/Truck gets a massive +600 bonus.',drift:'Max handling upgrades for drifts.',midnight:'Balance ALL stats for endurance.',ev:'Tesla, Rimac, Lucid get 500pt bonus.'};

async function startRace(rid){
  if(isRacing)return;
  const r=RACE_EVENTS.find(x=>x.id===rid);if(!r)return;
  const pc=playerCars.find(p=>p.is_active)||playerCars[0];
  if(!pc){toast('You need to set an active car in your Garage first!','t-error');return;}
  const c=pc.car||{};
  const s={power:(c.power||300)+(pc.power_boost||0),top_speed:(c.top_speed||150)+(pc.speed_boost||0),acceleration:c.acceleration||50,handling:(c.handling||50)+(pc.handling_boost||0),braking:c.braking||50};
  isRacing=true;

  const arena=document.getElementById('race-arena');
  arena.style.display='block';
  document.getElementById('race-result').style.display='none';
  document.getElementById('scoreboard').style.display='none';
  document.getElementById('arena-title').textContent=r.name;
  setArenaBadge('ready','READY');
  document.getElementById('p-lbl').textContent=(profile.username||'YOU').toUpperCase();
  document.getElementById('opp-lbl').textContent=r.oppName.toUpperCase();
  document.getElementById('player-lane-lbl').textContent=(profile.username||'YOU').slice(0,8).toUpperCase();
  document.getElementById('opp-lane-label').textContent=r.oppName.split(' ')[0].toUpperCase();
  document.getElementById('score-car-p').textContent=pc.car_emoji||'🚗';
  document.getElementById('score-name-p').textContent=(profile.username||'YOU').toUpperCase();
  document.getElementById('opp-emoji').textContent=r.oppEmoji||'🏎️';
  document.getElementById('opp-name').textContent=r.oppName;
  document.getElementById('r-player').textContent=pc.car_emoji||'🚗';
  document.getElementById('r-opp').textContent=r.oppEmoji||'🏎️';

  // Reset
  ['p-fill','o-fill'].forEach(id=>{const el=document.getElementById(id);el.style.transition='none';el.style.width='0%';});
  ['r-player','r-opp'].forEach(id=>{const el=document.getElementById(id);el.style.transition='none';el.style.left='3%';});
  document.getElementById('p-score').textContent='';
  document.getElementById('o-score').textContent='';
  document.getElementById('score-val-p').textContent='—';
  document.getElementById('score-val-o').textContent='—';
  document.getElementById('score-box-p').className='score-box';
  document.getElementById('score-box-o').className='score-box';

  // Countdown
  const ph=document.getElementById('phase-disp');
  ph.style.display='block';
  setArenaBadge('countdown','COUNTDOWN');
  for(const[i,txt]of['3','2','1','GO!'].entries()){
    await sleep(650);
    ph.textContent=txt;
    ph.className='phase-display '+(i===3?'phase-go':'phase-cd');
    ph.style.animation='none';void ph.offsetWidth;ph.style.animation='';
  }
  await sleep(250);ph.style.display='none';
  setArenaBadge('racing','RACING');

  const myScore=r.formula(s,c);
  const variance=r.opp*0.13;
  const oppScore=r.opp+(Math.random()*variance*2-variance);
  const won=myScore>oppScore;
  const close=Math.abs(myScore-oppScore)<r.opp*0.06;
  const mx=Math.max(myScore,oppScore,100);
  const pp=Math.min(88,Math.round((myScore/mx)*88));
  const op=Math.min(88,Math.round((oppScore/mx)*88));

  await sleep(100);
  document.getElementById('p-fill').style.cssText=`transition:width 2.4s cubic-bezier(.2,.6,.3,1);width:${pp}%`;
  document.getElementById('o-fill').style.cssText=`transition:width 2.8s cubic-bezier(.2,.6,.3,1);width:${op}%`;
  document.getElementById('r-player').style.cssText=`position:absolute;top:50%;transform:translateY(-50%);font-size:28px;z-index:4;line-height:1;filter:drop-shadow(0 0 8px rgba(212,32,32,.5));transition:left 2.4s cubic-bezier(.2,.6,.3,1);left:${pp}%`;
  document.getElementById('r-opp').style.cssText=`position:absolute;top:50%;transform:translateY(-50%);font-size:28px;z-index:4;line-height:1;filter:drop-shadow(0 0 8px rgba(200,80,80,.4));transition:left 2.8s cubic-bezier(.2,.6,.3,1);left:${op}%`;
  document.getElementById('p-score').textContent='Score: '+Math.round(myScore);
  document.getElementById('o-score').textContent='Score: '+Math.round(oppScore);
  await sleep(2900);

  setArenaBadge(won?'victory':'defeat',won?'VICTORY!':'DEFEAT');
  document.getElementById('scoreboard').style.display='grid';
  document.getElementById('score-val-p').textContent=Math.round(myScore);
  document.getElementById('score-val-o').textContent=Math.round(oppScore);
  document.getElementById('score-box-p').className='score-box '+(won?'winner':'loser');
  document.getElementById('score-box-o').className='score-box '+(won?'loser':'winner');

  // Update stats
  const cashGain=won?r.reward:0;
  const newCash=profile.cash+cashGain;
  const newWins=(profile.wins||0)+(won?1:0);
  const newLosses=(profile.losses||0)+(won?0:1);
  const newStreak=won?(profile.win_streak||0)+1:0;
  const newBestStreak=Math.max(profile.best_win_streak||0,newStreak);
  const newXp=(profile.xp||0)+r.xp;
  const newLevel=Math.floor(newXp/1000)+1;
  const levUp=newLevel>(profile.level||1);
  const newRep=(profile.reputation||0)+(won?12:3);
  await db.collection('profiles').doc(currentUser.uid).update({cash:newCash,wins:newWins,losses:newLosses,win_streak:newStreak,best_win_streak:newBestStreak,xp:newXp,level:newLevel,reputation:newRep});
  profile={...profile,cash:newCash,wins:newWins,losses:newLosses,win_streak:newStreak,best_win_streak:newBestStreak,xp:newXp,level:newLevel,reputation:newRep};
  db.collection('races').add({player_id:currentUser.uid,player_username:profile.username,car_name:pc.car_name,race_type:r.id,difficulty:r.diff,result:won?'win':'loss',player_score:Math.round(myScore),opp_score:Math.round(oppScore),reward:cashGain,xp:r.xp,created_at:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
  logActivity('race',{race:r.name,result:won?'win':'loss',reward:cashGain}).catch(()=>{});
  renderHUD();

  await sleep(400);
  const resultBox=document.getElementById('race-result');
  resultBox.style.display='block';
  resultBox.className='result-box '+(won?'result-win':'result-lose');
  const streakMsg=newStreak>2?` · 🔥 ${newStreak}-race streak!`:'';
  const closeMsg=close?' · Dead Heat — close call!':'';
  resultBox.innerHTML=won?`
    <div style="font-size:52px;margin-bottom:10px">🏆</div>
    <div class="result-title">VICTORY${close?' (CLOSE)':''}</div>
    <div class="result-rewards">
      <div class="result-rew-item"><div class="result-rew-val" style="color:var(--amber2)">+$${fmtCash(cashGain)}</div><div class="result-rew-lbl">Cash</div></div>
      <div class="result-rew-item"><div class="result-rew-val" style="color:var(--green2)">+${r.xp}</div><div class="result-rew-lbl">XP</div></div>
      <div class="result-rew-item"><div class="result-rew-val" style="color:var(--purple2)">+12</div><div class="result-rew-lbl">Rep</div></div>
    </div>
    <div class="result-detail">${streakMsg||closeMsg||'Well driven!'}</div>
    ${levUp?`<div style="margin-top:10px;padding:8px 14px;background:var(--amber3);border:1px solid rgba(200,120,32,.3);border-radius:var(--r);font-family:var(--disp);font-size:14px;font-weight:700;color:var(--amber2);letter-spacing:2px">⬆️ LEVEL UP → ${newLevel}!</div>`:''}`
  :`<div style="font-size:52px;margin-bottom:10px">💥</div>
    <div class="result-title">DEFEAT</div>
    <div class="result-rewards">
      <div class="result-rew-item"><div class="result-rew-val" style="color:var(--green2)">+${r.xp}</div><div class="result-rew-lbl">XP</div></div>
    </div>
    <div class="result-detail">${Math.round(myScore)} vs ${Math.round(oppScore)}</div>
    <div style="margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--text3);padding:8px;background:var(--panel2);border-radius:var(--r)">💡 ${RACE_TIPS[r.id]||'Upgrade your car!'}</div>`;
  resultBox.innerHTML+=`<div style="display:flex;gap:8px;justify-content:center;margin-top:16px"><button class="btn btn-ghost" onclick="resetArena()">↺ Race Again</button><button class="btn btn-ghost" onclick="showTab('garage')">🔧 Upgrade</button></div>`;

  if(won){toast(`Victory! +$${fmtCash(cashGain)}`,'t-success');showXpPop(`+${r.xp} XP`);if(levUp)showXpPop('⬆️ LEVEL UP!');}
  else toast('Defeat — check tips!','t-error');
  isRacing=false;
  checkAchievements();
}

  const el=document.getElementById('arena-badge');

      </div>
    </div>`;
  }).join('');
}

async function checkAchievements(){
  if(!profile)return;
  const earned=profile.achievements||[];
  const newlyEarned=[];
  for(const a of ACHIEVEMENTS){
    if(!earned.includes(a.id)&&a.check(profile,playerCars.length)){
      newlyEarned.push(a);
      earned.push(a.id);
    }
  }
  if(newlyEarned.length){
    const totalReward=newlyEarned.reduce((s,a)=>s+a.reward,0);
    await db.collection('profiles').doc(currentUser.uid).update({achievements:earned,cash:firebase.firestore.FieldValue.increment(totalReward)});
    profile.cash+=totalReward;profile.achievements=earned;
    renderHUD();
    newlyEarned.forEach(a=>{
      setTimeout(()=>toast(`🏅 Achievement: ${a.name} · +$${fmtCash(a.reward)}`,'t-success'),300);
      showXpPop(a.icon+' '+a.name);
    });
  }
}

// ═══ NPC ENGINE ═══
let npcAccounts=[];
const NPC_ADJECTIVES=['Ghost','Turbo','Nitro','Drag','Drift','Speed','Apex','Boost','Rev','Smoke','Burn','Flat'];
const NPC_NOUNS=['Racer','King','Hunter','Wolf','Fox','Hawk','Storm','Legend','Devil','Phantom'];

async function startNPCEngine(){
  // Load existing NPCs
  const snap=await db.collection('profiles').where('is_npc','==',true).limit(20).get();
  npcAccounts=snap.docs.map(d=>({id:d.id,...d.data()}));
  // Run NPC activities every 3-8 minutes
  scheduleNPCActivity();
}

function scheduleNPCActivity(){
  clearInterval(window._npcTick);
  const interval=180000+Math.random()*300000; // 3-8 min
  window._npcTick=setInterval(runNPCActivity,interval);
  // Also run once after 15s
  setTimeout(runNPCActivity,15000);
}

async function runNPCActivity(){
  if(!currentUser||!npcAccounts.length)return;
  try{
    // Pick random NPC
    const npc=npcAccounts[Math.floor(Math.random()*npcAccounts.length)];
    const action=Math.random();
    if(action<0.5){
      // NPC races
      const r=RACE_EVENTS[Math.floor(Math.random()*RACE_EVENTS.length)];
      const won=Math.random()>0.35;
      const cash=(npc.cash||5000)+(won?r.reward:0);
      const wins=(npc.wins||0)+(won?1:0);
      const losses=(npc.losses||0)+(won?0:1);
      const xp=(npc.xp||0)+r.xp;
      const level=Math.floor(xp/1000)+1;
      await db.collection('profiles').doc(npc.id).update({cash:Math.max(1000,cash),wins,losses,xp,level,win_streak:won?(npc.win_streak||0)+1:0}).catch(()=>{});
      npc.cash=cash;npc.wins=wins;
      if(document.getElementById('tab-leaderboard').classList.contains('active'))loadLeaderboard();
      showFeed(`🤖 ${npc.username} ${won?'won':'lost'} a ${r.name}${won?' and earned $'+fmtCash(r.reward):''}`);
    } else if(action<0.75){
      // NPC bids on auction
      const aSnap=await db.collection('auctions').where('status','==','active').limit(8).get();
      const now=new Date();
      const valid=aSnap.docs.filter(d=>{const t=d.data().ends_at?.toDate?.();return t&&t>now&&d.data().seller_id!==npc.id;});
      if(valid.length){
        const aDoc=valid[Math.floor(Math.random()*valid.length)];
        const a=aDoc.data();
        const bidAmt=Math.round(a.current_price*(1.05+Math.random()*0.1));
        if((npc.cash||0)>=bidAmt){
          if(a.highest_bidder_id&&a.highest_bidder_id!==npc.id)
            db.collection('profiles').doc(a.highest_bidder_id).update({cash:firebase.firestore.FieldValue.increment(a.current_price)}).catch(()=>{});
          await db.collection('auctions').doc(aDoc.id).update({current_price:bidAmt,highest_bidder_id:npc.id,highest_bidder_username:npc.username,bid_count:firebase.firestore.FieldValue.increment(1)});
          await db.collection('auctions').doc(aDoc.id).collection('bids').add({bidder_id:npc.id,bidder_username:npc.username,amount:bidAmt,created_at:firebase.firestore.FieldValue.serverTimestamp()});
          await db.collection('profiles').doc(npc.id).update({cash:firebase.firestore.FieldValue.increment(-bidAmt)}).catch(()=>{});
          showFeed(`🤖 ${npc.username} bid $${fmtCash(bidAmt)} on ${a.car_name}`);
          if(document.getElementById('tab-auction').classList.contains('active'))renderAuctions();
        }
      }
    } else {
      // NPC buys a car from market
      const affordable=CAR_DATA.filter(c=>{const p=marketPrices[c.name]?.current_price||c.base_price;return p<=(npc.cash||0)&&p<200000;});
      if(affordable.length){
        const car=affordable[Math.floor(Math.random()*affordable.length)];
        const price=marketPrices[car.name]?.current_price||car.base_price;
        await db.collection('player_cars').add({player_id:npc.id,car_name:car.name,car_class:car.class,car_emoji:car.emoji,purchase_price:price,is_active:true,is_favorite:false,power_boost:0,handling_boost:0,speed_boost:0,upgrades:{},acquired_at:firebase.firestore.FieldValue.serverTimestamp()});
        await db.collection('profiles').doc(npc.id).update({cash:firebase.firestore.FieldValue.increment(-price)}).catch(()=>{});
        npc.cash=(npc.cash||0)-price;
        showFeed(`🤖 ${npc.username} bought a ${car.name} from the market`);
      }
    }
  }catch(e){console.warn('NPC activity error:',e.message);}
}

// Create new NPC accounts periodically
async function maybeCreateNPC(){
  if(!currentUser)return;
  const snap=await db.collection('profiles').where('is_npc','==',true).get();
  if(snap.size>=20)return; // cap at 20 NPCs
  const adj=NPC_ADJECTIVES[Math.floor(Math.random()*NPC_ADJECTIVES.length)];
  const noun=NPC_NOUNS[Math.floor(Math.random()*NPC_NOUNS.length)];
  const num=Math.floor(Math.random()*999);
  const username=adj+noun+num;
  const email=`npc_${username.toLowerCase()}@redline-npc.gg`;
  const startCash=15000+Math.floor(Math.random()*50000);
  const npcRef=db.collection('profiles').doc();
  await npcRef.set({uid:npcRef.id,username,email,cash:startCash,level:1,xp:0,wins:0,losses:0,win_streak:0,best_win_streak:0,reputation:0,role:'player',is_banned:false,is_npc:true,daily_streak:0,last_daily:null,achievements:[],created_at:firebase.firestore.FieldValue.serverTimestamp()});
  // Give starter car
  const car=CAR_DATA.find(c=>c.name==='Toyota Supra MK5')||CAR_DATA[17];
  await db.collection('player_cars').add({player_id:npcRef.id,car_name:car.name,car_class:car.class,car_emoji:car.emoji,purchase_price:0,is_active:true,is_favorite:false,power_boost:0,handling_boost:0,speed_boost:0,upgrades:{},acquired_at:firebase.firestore.FieldValue.serverTimestamp()});
  npcAccounts.push({id:npcRef.id,username,cash:startCash,wins:0,losses:0,is_npc:true});
  showFeed(`🆕 ${username} joined REDLINE and hit the streets!`);
}

setInterval(()=>{if(currentUser)maybeCreateNPC().catch(()=>{});},1800000+Math.random()*1800000);

// NPC Activity Feed
function showFeed(msg){
  const feed=document.getElementById('npc-feed');
  if(!feed)return;
  const item=document.createElement('div');
  item.className='feed-item';
  item.textContent=msg;
  feed.appendChild(item);
  // Max 4 items
  while(feed.children.length>4)feed.removeChild(feed.firstChild);
  // Auto-fade after 8s
  setTimeout(()=>{item.classList.add('fade');setTimeout(()=>item.remove(),300);},8000);
}

async function setRole(uid,name,role){
  if(uid===currentUser.uid){toast("Can't change your own role",'t-error');return;}
  // Admins cannot assign owner role
  if(role==='owner'&&profile.role!=='owner'){toast('Only the owner can assign the owner role','t-error');return;}
  // Admins cannot change other admins or owners
  const targetSnap=await db.collection('profiles').doc(uid).get();
  const target=targetSnap.data();
  if(target.role==='owner'){toast("Cannot change the owner's role",'t-error');return;}
  if(target.role==='admin'&&profile.role!=='owner'){toast("Only the owner can change admin roles",'t-error');return;}
  await db.collection('profiles').doc(uid).update({role});
  toast(`${name} is now ${role}`,'t-success');
  logActivity('set_role',{target:name,role}).catch(()=>{});
}
async function banUser(uid,name){
  const reason=prompt(`Ban reason for ${name}:`,'Violation of terms');if(!reason)return;
  const targetSnap=await db.collection('profiles').doc(uid).get();
  if(targetSnap.data()?.role==='owner'){toast("Cannot ban the owner",'t-error');return;}
  if(targetSnap.data()?.role==='admin'&&profile.role!=='owner'){toast("Only the owner can ban admins",'t-error');return;}
  await db.collection('profiles').doc(uid).update({is_banned:true,ban_reason:reason});
  toast(`${name} banned`,'t-success');logActivity('ban',{target:name,reason}).catch(()=>{});
  loadAdminSec('users');
}
async function unbanUser(uid,name){

async function taxAll(){
  const pct=parseFloat(document.getElementById('econ-tax-pct').value);
  if(!pct||pct<1||pct>99){toast('Enter 1-99%','t-error');return;}
  if(!confirm(`Tax ${pct}% from ALL players?`))return;
  const snap=await db.collection('profiles').get();
  const batch=db.batch();
  snap.docs.filter(d=>!d.data().is_npc).forEach(d=>{const cash=d.data().cash||0;batch.update(d.ref,{cash:Math.max(500,Math.round(cash*(1-pct/100)))});});
  await batch.commit();toast(`Taxed ${pct}% from all players`,'t-success');
  logActivity('econ_tax',{pct}).catch(()=>{});
}
async function emergencyStimulus(){
  if(!confirm('Give $5000 to all broke players (<$1000)?'))return;
  const snap=await db.collection('profiles').where('cash','<',1000).get();
  const batch=db.batch();
  snap.docs.filter(d=>!d.data().is_npc).forEach(d=>batch.update(d.ref,{cash:5000}));
  await batch.commit();toast(`Stimulus given to ${snap.size} players`,'t-success');
  logActivity('econ_stimulus',{count:snap.size}).catch(()=>{});
}
async function setDailyMult(){
  const mult=parseFloat(document.getElementById('econ-daily-mult').value);
  if(!mult||mult<0.5){toast('Enter a valid multiplier (0.5+)','t-error');return;}
  await db.collection('settings').doc('game').set({daily_multiplier:mult},{merge:true});
  toast(`Daily multiplier set to ${mult}x`,'t-success');
  logActivity('set_daily_mult',{mult}).catch(()=>{});
}
async function adminRaces(el){
  const [rSnap,todaySnap]=await Promise.all([
    db.collection('races').orderBy('created_at','desc').limit(50).get(),
    db.collection('races').get()
  ]);
  const byType={};const byResult={win:0,loss:0};
  todaySnap.docs.forEach(d=>{const r=d.data();byType[r.race_type]=(byType[r.race_type]||0)+1;if(r.result)byResult[r.result]++;});
  const topType=Object.entries(byType).sort((a,b)=>b[1]-a[1])[0];
  el.innerHTML=`
    <div class="admin-stat-grid">
      <div class="admin-stat-card"><div class="admin-stat-val" style="color:var(--red2)">${todaySnap.size}</div><div class="admin-stat-lbl">Total Races</div></div>
      <div class="admin-stat-card"><div class="admin-stat-val" style="color:var(--green2)">${byResult.win||0}</div><div class="admin-stat-lbl">Total Wins</div></div>
      <div class="admin-stat-card"><div class="admin-stat-val" style="color:var(--steel2)">${topType?topType[0]:'?'}</div><div class="admin-stat-lbl">Most Popular</div></div>
    </div>
    <div style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">RECENT RACES</div>
    <table class="admin-table"><thead><tr><th>Player</th><th>Event</th><th>Result</th><th>Reward</th><th>Time</th></tr></thead>
    <tbody>${rSnap.docs.map(d=>{const r=d.data();const w=r.result==='win';return `<tr><td><strong>${r.player_username||'?'}</strong></td><td>${r.race_type||'?'} <span style="color:var(--text3);font-size:10px">· ${r.difficulty}</span></td><td><span class="badge ${w?'badge-green':'badge-red'}">${r.result||'?'}</span></td><td style="font-family:var(--mono);color:var(--amber2)">${r.reward>0?'$'+fmtCash(r.reward):'—'}</td><td style="font-family:var(--mono);font-size:9px;color:var(--text3)">${timeAgo(r.created_at?.toDate?.())}</td></tr>`;}).join('')}</tbody></table>`;
}
async function adminBroadcast(el){
  el.innerHTML=`
    <div style="font-family:var(--disp);font-size:12px;font-weight:700;color:var(--red2);letter-spacing:2px;margin-bottom:16px;text-transform:uppercase">System Broadcast</div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div><label class="form-label">Message (shown as toast to all active users)</label><textarea class="form-input" id="bc-msg" rows="3" placeholder="Type your announcement here..." style="resize:vertical;font-family:var(--body)"></textarea></div>
      <div><label class="form-label">Notification Type</label>
        <select class="form-input" id="bc-type">
          <option value="t-info">📢 Info (default)</option>
          <option value="t-success">✅ Success (green)</option>
          <option value="t-error">🚨 Alert (red)</option>
        </select>
      </div>
      <button class="btn btn-red btn-lg" onclick="sendBroadcast()">📢 Send to All Players</button>
      <div class="divider"></div>
      <div style="font-family:var(--disp);font-size:11px;font-weight:700;color:var(--amber2);letter-spacing:2px;margin-bottom:8px;text-transform:uppercase">Recent Broadcasts</div>
      <div id="bc-history"><div class="loading-screen"><div class="spinner"></div></div></div>
    </div>`;
  const snap=await db.collection('broadcasts').orderBy('created_at','desc').limit(10).get();
  document.getElementById('bc-history').innerHTML=snap.empty?'<div class="empty">No broadcasts yet.</div>':snap.docs.map(d=>{const b=d.data();return `<div style="padding:10px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px"><div style="font-size:13px;margin-bottom:4px">${b.message}</div><div style="font-family:var(--mono);font-size:9px;color:var(--text3)">by ${b.sender||'admin'} · ${timeAgo(b.created_at?.toDate())}</div></div>`;}).join('');
}
async function sendBroadcast(){
  const msg=document.getElementById('bc-msg').value.trim();
  const type=document.getElementById('bc-type').value;
  if(!msg){toast('Enter a message','t-error');return;}
  await db.collection('broadcasts').add({message:msg,type,sender:profile.username,created_at:firebase.firestore.FieldValue.serverTimestamp()});
  toast(msg,type);
  logActivity('broadcast',{message:msg}).catch(()=>{});
  toast('Broadcast sent! ✓','t-success');
  loadAdminSec('broadcast');
}

async function adminSaveSetting(key,val){
  if(val===undefined||val===null||isNaN(val)&&typeof val!=='boolean'){toast('Invalid value','t-error');return;}
  await db.collection('settings').doc('game').set({[key]:val},{merge:true});
  toast(`Setting '${key}' updated to ${val}`,'t-success');
  logActivity('admin_setting',{key,val}).catch(()=>{});
  loadAdminSec('settings');
}
async function promoteSelfOwner(){
  if(!confirm('Promote yourself to Owner? This cannot be undone by anyone except another Owner.'))return;
  await db.collection('profiles').doc(currentUser.uid).update({role:'owner'});
  profile.role='owner';renderHUD();
  toast('You are now the Owner! 👑','t-success');
  logActivity('self_promote_owner',{}).catch(()=>{});
  loadAdminSec('settings');
}

async function logActivity(action,details){
  if(!currentUser||!profile)return;
  await db.collection('activity_logs').add({user_id:currentUser.uid,username:profile.username,action,details:details||{},created_at:firebase.firestore.FieldValue.serverTimestamp()});
