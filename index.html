    // ═══════════════════════════════════════════════
    // SUPABASE INIT — stronger connection + retries
    // ═══════════════════════════════════════════════
    const SUPABASE_URL = 'https://jupzjwaclgpldqazarmq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1cHpqd2FjbGdwbGRxYXphcm1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTkxOTIsImV4cCI6MjA5Njc3NTE5Mn0.hS9KBOVW_GZ_f2EBfxaiC3HSpcVDsvTHGAS5_Q_56YU';
    
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        flowType: 'pkce'
      },
      global: {
        headers: { 'x-redline-client': 'web-v2' }
      },
      realtime: {
        params: { eventsPerSecond: 10 }
      }
    });
    
    let dbOnline = true;
    
    function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
    
    async function withTimeout(promise, ms=10000, label='Database request') {
      let timer;
      const timeout = new Promise((_, reject)=>{
        timer = setTimeout(()=>reject(new Error(`${label} timed out`)), ms);
      });
      try { return await Promise.race([promise, timeout]); }
      finally { clearTimeout(timer); }
    }
    
    async function dbTry(fn, label='Database request', tries=3) {
      let lastErr;
      for (let i=0; i<tries; i++) {
        try {
          const result = await withTimeout(fn(), 12000, label);
          if (result?.error) throw result.error;
          dbOnline = true;
          return result;
        } catch (err) {
          lastErr = err;
          dbOnline = false;
          console.warn(`[DB retry ${i+1}/${tries}] ${label}:`, err?.message || err);
          if (i < tries - 1) await sleep(500 * Math.pow(2, i));
        }
      }
      toast(`DB connection issue: ${lastErr?.message || 'request failed'}`, 't-error');
      throw lastErr;
    }
    
    async function checkDbHealth() {
      try {
        await dbTry(()=>sb.from('profiles').select('id',{count:'exact',head:true}).limit(1), 'Health check', 1);
        dbOnline = true;
      } catch (_) { dbOnline = false; }
      document.documentElement.classList.toggle('db-offline', !dbOnline);
    }
    setInterval(checkDbHealth, 30000);
  </script>
  <script>
    async function doSignup() {
      const username = document.getElementById('signup-user').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const pass = document.getElementById('signup-pass').value;
      if (!username||!email||!pass) { showAuthErr('All fields required'); return; }
      if (pass.length<6) { showAuthErr('Password must be 6+ characters'); return; }
      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { showAuthErr('Username: 3-20 chars, letters/numbers/underscores only'); return; }
    
      const {data:taken} = await dbTry(
        ()=>sb.from('profiles').select('id').ilike('username', username).maybeSingle(),
        'Check username'
      );
      if (taken) { showAuthErr('That username is already taken'); return; }
    
      showAuthErr('');
      const {data, error} = await sb.auth.signUp({
        email,
        password: pass,
        options: {
          data: { username },
          emailRedirectTo: window.location.origin
        }
      });
      if (error) { showAuthErr(error.message); return; }
    
      // If email confirmations are OFF in Supabase, session exists immediately.
      if (data?.session) {
        showAuthErr('Account created. Starting engine...', false);
        currentUser = data.session.user;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        await initGame();
        return;
      }
    
      // If Supabase still requires confirmation, this message tells you the exact dashboard fix.
      showAuthErr('Account created. If it does not auto-login, disable Confirm email in Supabase Auth settings.', false);
    }
  </script>
  <script>
    async function loadProfile() {
      const {data,error} = await dbTry(()=>sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle(), 'Load profile');
      if (error || !data) {
        const username = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
        const {data:newProf} = await dbTry(()=>sb.from('profiles').upsert({
          id:currentUser.id, username, cash:50000, role:'player'
        }).select().single(), 'Create profile');
        profile = newProf || {id:currentUser.id,username,cash:50000,level:1,xp:0,wins:0,losses:0,win_streak:0,best_win_streak:0,reputation:0,role:'player'};
      } else profile = data;
    
      if (profile.is_banned) {
        await sb.auth.signOut();
        document.getElementById('auth-screen').style.display='flex';
        document.getElementById('game').style.display='none';
        showAuthErr(`Account suspended: ${profile.ban_reason||'Contact support'}`);
        return;
      }
    
      await logActivity('login', {role: profile.role, level: profile.level});
      const {count} = await dbTry(()=>sb.from('player_cars').select('*',{count:'exact',head:true}).eq('player_id',currentUser.id), 'Count player cars');
      if (count === 0) await giveStarterCar();
    }
    
    async function loadAllCars() {
      const {data} = await dbTry(()=>sb.from('cars').select('*').order('base_price'), 'Load cars');
      allCars = data || [];
    }
    
    async function loadMarketPrices() {
      const {data} = await dbTry(()=>sb.from('market_prices').select('*'), 'Load market prices');
      marketPrices = {};
      if (data) data.forEach(mp => { marketPrices[mp.car_id] = mp; });
    }
    
    async function loadPlayerCars() {
      const {data} = await dbTry(()=>sb.from('player_cars').select('*, car:cars(*)').eq('player_id',currentUser.id), 'Load player cars');
      playerCars = data || [];
    }
    
    async function loadUpgradeCatalog() {
      const {data} = await dbTry(()=>sb.from('upgrade_catalog').select('*').order('level'), 'Load upgrade catalog');
      upgradeCatalog = data || [];
    }
  </script>
