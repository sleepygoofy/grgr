cat > /mnt/user-data/outputs/redline.html << 'HTMLEOF'
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REDLINE</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#05060a;--bg2:#08090f;--bg3:#0d0f18;
  --panel:#0d0f18;--panel2:#121420;--panel3:#171a28;
  --border:#1c1f30;--border2:#252840;--border3:#303550;
  --red:#d42020;--red2:#f03535;--red3:rgba(212,32,32,.1);
  --amber:#c87820;--amber2:#e09030;--amber3:rgba(200,120,32,.1);
  --steel:#c0c8e0;--steel2:#8890a8;--steel3:#404860;
  --green:#258035;--green2:#35a048;--green3:rgba(37,128,53,.1);
  --blue:#1858a0;--blue2:#2878d0;--blue3:rgba(24,88,160,.1);
  --purple:#5828a0;--purple2:#7848c8;--purple3:rgba(88,40,160,.1);
  --cyan:#0ea5e9;--cyan2:rgba(14,165,233,.1);
  --text:#d8daea;--text2:#7880a0;--text3:#383d58;--text4:#1c2038;
  --mono:'Share Tech Mono',monospace;
  --disp:'Orbitron',sans-serif;
  --body:'Rajdhani',sans-serif;
  --r:5px;--r2:8px;
  --glow-red:0 0 20px rgba(212,32,32,.3);
  --glow-amber:0 0 16px rgba(200,120,32,.2);
  --glow-steel:0 0 16px rgba(192,200,224,.1);
  --glow-cyan:0 0 16px rgba(14,165,233,.2);
}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:15px;}
button{font-family:var(--body);cursor:pointer;}
input,select,textarea{font-family:var(--body);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* AUTH */
#auth-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;background-image:radial-gradient(ellipse at 20% 50%,rgba(212,32,32,.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 30%,rgba(192,200,224,.03) 0%,transparent 60%);}
.auth-box{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:36px;position:relative;overflow:hidden;}
.auth-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),var(--steel),var(--amber),transparent);}
.auth-logo{font-family:var(--disp);font-weight:900;font-size:38px;letter-spacing:10px;text-align:center;margin-bottom:3px;color:var(--red2);text-shadow:var(--glow-red);}
.auth-sub{text-align:center;font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:3px;margin-bottom:28px;text-transform:uppercase;}
.auth-tabs{display:flex;margin-bottom:22px;background:var(--bg3);border-radius:var(--r);padding:3px;gap:3px;}
.auth-tab{flex:1;padding:8px;text-align:center;font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;background:transparent;border:none;color:var(--text3);border-radius:3px;transition:all .15s;}
.auth-tab.active{background:var(--panel2);color:var(--red2);box-shadow:inset 0 0 8px rgba(212,32,32,.1);}
.form-group{margin-bottom:14px;}
.form-label{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;display:block;margin-bottom:5px;}
.form-input{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:14px;outline:none;transition:border-color .15s;font-family:var(--mono);}
.form-input:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(212,32,32,.06);}
.btn-auth{width:100%;padding:12px;background:var(--red);border:none;border-radius:var(--r);color:#fff;font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .15s;margin-top:6px;}
.btn-auth:hover{background:var(--red2);box-shadow:var(--glow-red);}
.auth-msg{font-size:12px;font-family:var(--mono);margin-top:10px;text-align:center;display:none;padding:8px;border-radius:var(--r);}
.auth-msg.err{color:#e07070;background:rgba(180,30,30,.15);border:1px solid rgba(180,30,30,.3);}
.auth-msg.ok{color:var(--green2);background:var(--green3);border:1px solid rgba(37,128,53,.3);}

/* DAILY */
.daily-banner{position:fixed;inset:0;z-index:8000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);backdrop-filter:blur(4px);}
.daily-banner.show{display:flex;}
.daily-box{background:var(--panel);border:1px solid var(--amber);border-radius:var(--r2);padding:36px;text-align:center;max-width:360px;width:100%;box-shadow:var(--glow-amber),0 0 60px rgba(200,120,32,.08);}
.daily-title{font-family:var(--disp);font-size:18px;font-weight:900;color:var(--amber2);letter-spacing:5px;margin-bottom:6px;text-transform:uppercase;}
.daily-amount{font-family:var(--disp);font-size:52px;font-weight:900;color:var(--amber2);margin:14px 0;text-shadow:var(--glow-amber);}
.daily-streak{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:20px;}
.daily-days{display:flex;justify-content:center;gap:6px;margin-bottom:20px;}
.daily-day{width:38px;height:38px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:10px;font-weight:700;border:1px solid var(--border2);color:var(--text3);}
.daily-day.done{background:var(--amber3);border-color:rgba(200,120,32,.4);color:var(--amber2);}
.daily-day.today{background:var(--amber);border-color:var(--amber2);color:#000;box-shadow:var(--glow-amber);}

/* HEADER */
#game{display:none;min-height:100vh;}
.header{background:rgba(5,6,10,.98);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200;}
.logo{font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:7px;color:var(--red2);text-shadow:var(--glow-red);}
.logo-sub{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:2px;line-height:1;margin-top:2px;display:block;}
.hud{display:flex;gap:6px;align-items:center;}
.hud-pill{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:4px 10px;text-align:center;min-width:64px;transition:border-color .2s;}
.hud-pill:hover{border-color:var(--border2);}
.hud-pill .lbl{font-family:var(--mono);font-size:8px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;}
.hud-pill .val{font-family:var(--disp);font-size:14px;font-weight:700;}
.val-cash{color:var(--amber2);}
.val-level{color:var(--steel);}
.val-wins{color:var(--green2);}
.hud-avatar{width:32px;height:32px;border-radius:50%;background:var(--red3);border:1px solid var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:13px;color:var(--red2);cursor:pointer;position:relative;transition:all .15s;}
.hud-avatar:hover{box-shadow:var(--glow-red);}
.hud-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--panel2);border:1px solid var(--border2);border-radius:var(--r2);min-width:200px;z-index:300;display:none;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.6);}
.hud-menu.open{display:block;}
.hud-menu-top{padding:12px 14px 10px;border-bottom:1px solid var(--border);background:var(--panel3);}
.hud-menu-item{padding:10px 14px;font-size:13px;cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--text);}
.hud-menu-item:hover{background:var(--panel3);}
.hud-menu-item.danger{color:#e07070;}
.hud-menu-divider{height:1px;background:var(--border);margin:4px 0;}

/* NAV */
.nav{background:rgba(5,6,10,.96);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 12px;gap:2px;}
.nav-tab{padding:12px 16px;font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;flex-shrink:0;background:none;border-left:none;border-right:none;border-top:none;}
.nav-tab:hover{color:var(--steel2);}
.nav-tab.active{color:var(--red2);border-bottom-color:var(--red);}

/* MAIN */
.main{padding:20px;max-width:1380px;margin:0 auto;}
.section{display:none;}
.section.active{display:block;}
.sec-head{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
.sec-title{font-family:var(--disp);font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:3px;line-height:1;color:var(--steel);}
.sec-sub{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1.5px;margin-top:4px;text-transform:uppercase;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
@media(max-width:900px){.grid-2{grid-template-columns:1fr;}.grid-3{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.grid-3{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:18px;}
.panel h3{font-family:var(--disp);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;color:var(--steel2);}
.panel-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.panel-hd h3{margin-bottom:0;}

/* BADGES */
.badge{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:2px 7px;border-radius:3px;}
.badge-common{background:rgba(60,65,85,.5);color:var(--steel2);border:1px solid var(--border2);}
.badge-rare{background:var(--blue3);color:var(--blue2);border:1px solid rgba(24,88,160,.3);}
.badge-epic{background:var(--purple3);color:var(--purple2);border:1px solid rgba(88,40,160,.3);}
.badge-gold{background:var(--amber3);color:var(--amber2);border:1px solid rgba(200,120,32,.3);}
.badge-mythic{background:linear-gradient(135deg,rgba(88,40,160,.2),rgba(212,32,32,.2));color:#c890ff;border:1px solid rgba(160,80,200,.35);}
.badge-green{background:var(--green3);color:var(--green2);border:1px solid rgba(37,128,53,.3);}
.badge-red{background:var(--red3);color:var(--red2);border:1px solid rgba(212,32,32,.3);}
.badge-steel{background:rgba(64,72,96,.5);color:var(--steel2);border:1px solid var(--border2);}
.badge-cyan{background:var(--cyan2);color:var(--cyan);border:1px solid rgba(14,165,233,.25);}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:var(--r);font-size:11px;font-weight:700;cursor:pointer;border:none;transition:all .12s;font-family:var(--disp);letter-spacing:1px;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;}
.btn-red{background:var(--red);color:#fff;border:1px solid var(--red2);}.btn-red:hover{background:var(--red2);box-shadow:var(--glow-red);}
.btn-hot{background:var(--red);color:#fff;}.btn-hot:hover{background:var(--red2);box-shadow:var(--glow-red);}
.btn-gold{background:var(--amber3);color:var(--amber2);border:1px solid rgba(200,120,32,.3);}.btn-gold:hover{background:rgba(200,120,32,.18);box-shadow:var(--glow-amber);}
.btn-ghost{background:var(--panel3);color:var(--text2);border:1px solid var(--border2);}.btn-ghost:hover{color:var(--text);border-color:var(--border3);}
.btn-steel{background:rgba(64,72,96,.5);color:var(--steel2);border:1px solid var(--border2);}.btn-steel:hover{color:var(--steel);border-color:var(--border3);}
.btn-green{background:var(--green3);color:var(--green2);border:1px solid rgba(37,128,53,.3);}
.btn-purple{background:var(--purple3);color:var(--purple2);border:1px solid rgba(88,40,160,.3);}
.btn-blue{background:var(--blue3);color:var(--blue2);border:1px solid rgba(24,88,160,.3);}
.btn-cyan{background:var(--cyan2);color:var(--cyan);border:1px solid rgba(14,165,233,.25);}.btn-cyan:hover{box-shadow:var(--glow-cyan);}
.btn-lg{padding:11px 24px;font-size:12px;letter-spacing:2px;}
.btn-sm{padding:4px 9px;font-size:10px;}
.btn:disabled{opacity:.3;cursor:not-allowed;}

/* STAT BARS */
.stat-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.stat-lbl{width:80px;font-family:var(--mono);font-size:9px;color:var(--text3);flex-shrink:0;text-transform:uppercase;letter-spacing:1px;}
.stat-bar-wrap{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.stat-bar{height:100%;border-radius:2px;transition:width .5s;}
.stat-val{width:55px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--text2);}

/* CAR CARDS */
.car-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:14px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.car-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red),var(--amber));opacity:0;transition:opacity .15s;}
.car-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.5);}
.car-card:hover::after{opacity:1;}
.car-card.selected{border-color:var(--red);box-shadow:0 0 0 1px rgba(212,32,32,.15),var(--glow-red);}
.car-card.selected::after{opacity:1;}
.car-emoji{font-size:36px;margin-bottom:8px;line-height:1;}
.car-name{font-family:var(--disp);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;line-height:1.2;}
.car-brand{font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
.sel-tag{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:1px;background:var(--red);color:#fff;padding:2px 5px;border-radius:2px;}
.rarity-strip{position:absolute;bottom:0;left:0;right:0;height:2px;}
.rarity-common{background:var(--border2);}
.rarity-rare{background:var(--blue2);}
.rarity-epic{background:var(--purple2);}
.rarity-legendary{background:var(--amber2);}
.rarity-mythic{background:linear-gradient(90deg,var(--red),var(--purple2),var(--amber2));}

/* FILTER */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filter-btn{padding:5px 11px;border-radius:20px;font-family:var(--mono);font-size:9px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text3);transition:all .12s;text-transform:uppercase;letter-spacing:1px;}
.filter-btn.active,.filter-btn:hover{border-color:var(--red);color:var(--red2);background:var(--red3);}
.filter-search{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--text);outline:none;font-family:var(--mono);width:160px;}
.filter-search:focus{border-color:var(--red);}

/* GARAGE */
.garage-layout{display:grid;grid-template-columns:1fr 320px;gap:16px;}
@media(max-width:900px){.garage-layout{grid-template-columns:1fr;}}
.upgrade-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;transition:border-color .15s;}
.upgrade-item:hover{border-color:var(--border2);}
.upgrade-name{font-weight:700;font-size:13px;margin-bottom:2px;font-family:var(--disp);letter-spacing:.5px;}
.upgrade-meta{font-size:11px;color:var(--text2);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border2);display:inline-block;}
.dot.filled{background:var(--amber);box-shadow:0 0 4px rgba(200,120,32,.6);}
.upgrade-dots{display:flex;gap:3px;margin-top:4px;}

/* MARKET */
.ticker-bar{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:7px 12px;margin-bottom:12px;font-family:var(--mono);font-size:10px;color:var(--text3);overflow:hidden;white-space:nowrap;}
.ticker-text{display:inline-block;animation:tickerScroll 50s linear infinite;}
@keyframes tickerScroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.delta-up{color:var(--green2);}
.delta-down{color:var(--red2);}

/* AUCTION */
.auction-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:16px;transition:all .15s;position:relative;overflow:hidden;}
.auction-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:.25;}
.auction-card:hover{border-color:var(--border2);transform:translateY(-1px);}
.auction-timer{font-family:var(--mono);font-size:12px;color:var(--amber2);font-weight:700;}
.auction-timer.urgent{color:var(--red2);animation:urgPulse 1s infinite;}
@keyframes urgPulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.auction-price{font-family:var(--disp);font-size:20px;font-weight:700;color:var(--text);}
.auction-bids{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:2px;}
.bid-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.bid-row:last-child{border-bottom:none;}
.bid-amount{font-family:var(--mono);color:var(--amber2);}

/* RACE */
.race-events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:24px;}
.race-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.race-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .2s;pointer-events:none;}
.race-card.easy::before{background:radial-gradient(ellipse at 0% 100%,rgba(37,128,53,.08),transparent 70%);}
.race-card.medium::before{background:radial-gradient(ellipse at 0% 100%,rgba(200,120,32,.08),transparent 70%);}
.race-card.hard::before{background:radial-gradient(ellipse at 0% 100%,rgba(212,32,32,.08),transparent 70%);}
.race-card.elite::before{background:radial-gradient(ellipse at 0% 100%,rgba(88,40,160,.1),transparent 70%);}
.race-card:hover::before{opacity:1;}
.race-card:hover{transform:translateY(-3px);}
.race-card.easy:hover{border-color:rgba(37,128,53,.4);}
.race-card.medium:hover{border-color:rgba(200,120,32,.4);}
.race-card.hard:hover{border-color:rgba(212,32,32,.4);}
.race-card.elite:hover{border-color:rgba(88,40,160,.4);}
.diff-pip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:2px;padding:3px 8px;border-radius:3px;text-transform:uppercase;margin-bottom:10px;}
.pip-easy{background:var(--green3);color:var(--green2);border:1px solid rgba(37,128,53,.3);}
.pip-medium{background:var(--amber3);color:var(--amber2);border:1px solid rgba(200,120,32,.3);}
.pip-hard{background:var(--red3);color:var(--red2);border:1px solid rgba(212,32,32,.3);}
.pip-elite{background:var(--purple3);color:var(--purple2);border:1px solid rgba(88,40,160,.3);}
.race-name{font-family:var(--disp);font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;color:var(--steel);}
.race-desc{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5;}
.race-footer{display:flex;justify-content:space-between;align-items:center;}
.race-reward{font-family:var(--mono);font-size:11px;color:var(--amber2);font-weight:700;}

/* RACE ARENA */
.race-arena{display:none;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:28px;margin-bottom:16px;position:relative;overflow:hidden;}
.race-arena::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(212,32,32,.04),transparent 60%);pointer-events:none;}
.arena-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.arena-title{font-family:var(--disp);font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:3px;color:var(--red2);}
.arena-badge{font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:3px;letter-spacing:1px;text-transform:uppercase;}
.arena-badge.ready{background:var(--blue3);color:var(--blue2);border:1px solid rgba(24,88,160,.3);}
.arena-badge.countdown{background:var(--amber3);color:var(--amber2);border:1px solid rgba(200,120,32,.3);}
.arena-badge.racing{background:var(--red3);color:var(--red2);border:1px solid rgba(212,32,32,.3);animation:urgPulse 1s infinite;}
.arena-badge.victory{background:var(--green3);color:var(--green2);border:1px solid rgba(37,128,53,.3);}
.arena-badge.defeat{background:rgba(80,30,30,.3);color:#e06060;border:1px solid rgba(180,40,40,.3);}
.phase-display{font-family:var(--disp);font-size:72px;font-weight:900;text-align:center;letter-spacing:8px;text-transform:uppercase;padding:14px 0;display:none;text-shadow:0 0 40px currentColor;}
.phase-cd{color:var(--red2);}
.phase-go{color:var(--green2);}
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
.score-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center;transition:all .4s;}
.score-box.winner{border-color:var(--green2);background:rgba(37,128,53,.05);box-shadow:0 0 20px rgba(37,128,53,.12);}
.score-box.loser{border-color:rgba(180,40,40,.4);background:rgba(180,40,40,.04);}
.score-label{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;}
.score-car{font-size:40px;margin-bottom:6px;line-height:1;}
.score-name{font-family:var(--disp);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;color:var(--text2);}
.score-val{font-family:var(--disp);font-size:32px;font-weight:900;line-height:1;color:var(--steel);}
.score-box.winner .score-val{color:var(--green2);}
.score-box.loser .score-val{color:var(--red2);}

/* MULTI-LANE RACE TRACK */
.race-track{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px;}
.track-header{display:flex;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;}
.track-inner{padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.track-lane{position:relative;height:46px;background:linear-gradient(90deg,rgba(255,255,255,.01),rgba(255,255,255,.02),rgba(255,255,255,.01));border-radius:4px;overflow:hidden;border:1px solid var(--border);}
.track-lane.player-lane{border-color:rgba(212,32,32,.25);}
.lane-road{position:absolute;inset:0;overflow:hidden;}
.road-stripe{position:absolute;top:50%;width:40px;height:2px;background:rgba(255,255,255,.05);border-radius:1px;transform:translateY(-50%);}
.lane-label{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:8px;color:var(--text3);z-index:3;text-transform:uppercase;letter-spacing:1px;background:rgba(5,6,10,.8);padding:1px 4px;border-radius:2px;}
.lane-pos{position:absolute;right:30px;top:50%;transform:translateY(-50%);font-family:var(--disp);font-size:10px;font-weight:700;color:var(--text3);z-index:3;}
.lane-car{position:absolute;top:50%;transform:translateY(-50%);font-size:24px;z-index:4;left:3%;line-height:1;transition:left 2.4s cubic-bezier(.2,.6,.3,1);}
.lane-car.is-player{filter:drop-shadow(0 0 8px rgba(212,32,32,.6));}
.lane-car.is-npc{transition-duration:2.6s;}
.lane-finish{position:absolute;right:0;top:0;bottom:0;width:20px;background:repeating-conic-gradient(rgba(255,255,255,.07) 0% 25%,rgba(255,255,255,.01) 0% 50%) 0 0/10px 10px;z-index:2;}

/* SPEED BARS */
.speed-bar-section{margin-bottom:16px;}
.speed-row{margin-bottom:8px;}
.speed-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;margin-bottom:4px;}
.speed-name{color:var(--text2);}
.speed-score{color:var(--text3);}
.speed-track-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;border:1px solid var(--border);}
.speed-fill{height:100%;border-radius:3px;width:0%;transition:width 2.4s cubic-bezier(.2,.6,.3,1);}
.fill-p{background:linear-gradient(90deg,var(--amber),var(--amber2));}
.fill-npc{transition-duration:2.6s;}

/* RESULT */
.result-box{border-radius:var(--r2);padding:28px;display:none;text-align:center;position:relative;overflow:hidden;}
.result-win{background:linear-gradient(135deg,rgba(37,128,53,.08),rgba(200,120,32,.04));border:1px solid rgba(37,128,53,.3);}
.result-lose{background:linear-gradient(135deg,rgba(212,32,32,.08),rgba(88,40,160,.04));border:1px solid rgba(212,32,32,.3);}
.result-title{font-family:var(--disp);font-size:42px;font-weight:900;letter-spacing:4px;text-transform:uppercase;}
.result-win .result-title{color:var(--green2);text-shadow:0 0 30px rgba(37,128,53,.4);}
.result-lose .result-title{color:var(--red2);text-shadow:0 0 30px rgba(212,32,32,.4);}
.result-detail{font-family:var(--mono);font-size:11px;color:var(--text2);margin-top:8px;line-height:1.7;}
.result-rewards{display:flex;justify-content:center;gap:20px;margin:14px 0;flex-wrap:wrap;}
.result-rew-item{text-align:center;}
.result-rew-val{font-family:var(--disp);font-size:20px;font-weight:700;}
.result-rew-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}

/* RACE POSITIONS TABLE */
.race-positions{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px;overflow:hidden;}
.race-pos-header{padding:8px 12px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;display:flex;justify-content:space-between;}
.race-pos-row{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--border);transition:background .1s;}
.race-pos-row:last-child{border-bottom:none;}
.race-pos-row.is-you{background:rgba(212,32,32,.05);}
.race-pos-num{font-family:var(--disp);font-size:13px;font-weight:700;width:22px;text-align:center;}
.race-pos-car{font-size:18px;width:24px;text-align:center;}
.race-pos-name{flex:1;font-weight:700;font-size:12px;font-family:var(--disp);letter-spacing:.5px;}
.race-pos-score{font-family:var(--mono);font-size:10px;color:var(--text3);}

/* LEADERBOARD */
.lb-table{width:100%;border-collapse:collapse;}
.lb-table th{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);}
.lb-table td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;}
.lb-table tr:last-child td{border-bottom:none;}
.lb-table tr:hover td{background:var(--panel2);}
.lb-val{font-family:var(--mono);font-size:11px;color:var(--amber2);text-align:right;}
.lb-rank{font-family:var(--disp);font-size:14px;font-weight:700;width:36px;color:var(--text3);}

/* PROFILE */
.profile-hero{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:24px;margin-bottom:18px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden;flex-wrap:wrap;}
.profile-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--red),var(--amber),transparent);}
.prof-avatar{width:68px;height:68px;border-radius:50%;background:var(--red3);border:2px solid var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-size:26px;color:var(--red2);flex-shrink:0;}
.prof-name-big{font-family:var(--disp);font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:3px;color:var(--steel);}
.xp-bar-wrap{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:8px;width:200px;}
.xp-bar{height:100%;background:linear-gradient(90deg,var(--red),var(--amber));border-radius:2px;transition:width .6s;}
.profile-stats{display:flex;gap:20px;margin-left:auto;}
.profile-stat{text-align:center;}
.profile-stat .pnum{font-family:var(--disp);font-size:24px;font-weight:700;}
.profile-stat .plbl{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.ach-card{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;gap:10px;align-items:center;transition:border-color .15s;}
.ach-card.earned{border-color:rgba(200,120,32,.3);background:var(--amber3);}
.ach-card:hover{border-color:var(--border2);}
.ach-icon{font-size:24px;flex-shrink:0;}
.ach-name{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;}
.ach-desc{font-family:var(--mono);font-size:9px;color:var(--text3);}

/* ROLE BADGES */
.role-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:20px;}
.role-owner{background:linear-gradient(135deg,rgba(88,40,160,.3),rgba(212,32,32,.3));color:#fff;border:1px solid rgba(160,80,200,.4);}
.role-admin{background:var(--red3);color:var(--red2);border:1px solid rgba(212,32,32,.3);}
.role-moderator{background:var(--amber3);color:var(--amber2);border:1px solid rgba(200,120,32,.3);}
.role-player{background:var(--panel3);color:var(--text3);border:1px solid var(--border);}
.role-npc{background:rgba(30,32,55,.5);color:var(--text3);border:1px solid var(--border);}

/* ADMIN */
.admin-layout{display:grid;grid-template-columns:190px 1fr;gap:0;min-height:620px;border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;}
.admin-sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:12px 0;}
.admin-nav-item{padding:10px 16px;font-family:var(--mono);font-size:10px;cursor:pointer;color:var(--text3);transition:all .12s;border-left:2px solid transparent;letter-spacing:1px;text-transform:uppercase;}
.admin-nav-item:hover{background:var(--panel);color:var(--text2);}
.admin-nav-item.active{background:var(--panel);color:var(--red2);border-left-color:var(--red);}
.admin-content{background:var(--panel);padding:20px;overflow-y:auto;max-height:85vh;}
.admin-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.admin-stat-card{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;}
.admin-stat-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red),var(--amber));opacity:.3;}
.admin-stat-val{font-family:var(--disp);font-size:26px;font-weight:700;}
.admin-stat-lbl{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}
.admin-table{width:100%;border-collapse:collapse;font-size:12px;}
.admin-table th{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
.admin-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.admin-table tr:hover td{background:var(--panel2);}
.log-action{font-family:var(--mono);font-size:10px;color:var(--red2);}
.admin-search{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:6px 10px;color:var(--text);font-size:12px;outline:none;width:200px;font-family:var(--mono);}
.admin-search:focus{border-color:var(--red);}
.live-activity{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:12px;max-height:220px;overflow-y:auto;}
.live-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px;align-items:flex-start;}
.live-row:last-child{border-bottom:none;}
.live-time{font-family:var(--mono);font-size:9px;color:var(--text3);white-space:nowrap;margin-top:1px;flex-shrink:0;}

/* ADMIN NPC MONITOR */
.npc-monitor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:16px;}
.npc-monitor-card{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:10px;position:relative;overflow:hidden;}
.npc-monitor-card.active-race{border-color:rgba(212,32,32,.3);animation:npcRacePulse 2s infinite;}
@keyframes npcRacePulse{0%,100%{box-shadow:none;}50%{box-shadow:0 0 12px rgba(212,32,32,.15);}}
.npc-monitor-card.bidding{border-color:rgba(200,120,32,.3);}
.npc-monitor-card.buying{border-color:rgba(37,128,53,.3);}
.npc-status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;}
.npc-status-idle{background:var(--text3);}
.npc-status-racing{background:var(--red2);animation:rtPulse 1s infinite;}
.npc-status-bidding{background:var(--amber2);}
.npc-status-buying{background:var(--green2);}

/* CHAT */
.chat-panel{position:fixed;bottom:24px;right:24px;z-index:500;width:320px;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);box-shadow:0 12px 40px rgba(0,0,0,.7);display:none;flex-direction:column;max-height:400px;}
.chat-panel.open{display:flex;}
.chat-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.chat-title{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:2px;color:var(--cyan);text-transform:uppercase;}
.chat-online{font-family:var(--mono);font-size:9px;color:var(--text3);display:flex;align-items:center;gap:5px;}
.chat-messages{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:200px;max-height:280px;}
.chat-msg{display:flex;flex-direction:column;gap:2px;animation:feedSlide .2s ease;}
.chat-msg-author{font-family:var(--mono);font-size:9px;display:flex;align-items:center;gap:5px;}
.chat-msg-text{font-size:12px;color:var(--text);background:var(--panel2);border-radius:0 var(--r) var(--r) var(--r);padding:5px 8px;border:1px solid var(--border);width:fit-content;max-width:240px;line-height:1.4;}
.chat-msg.is-me .chat-msg-text{background:var(--red3);border-color:rgba(212,32,32,.2);margin-left:auto;border-radius:var(--r) 0 var(--r) var(--r);}
.chat-msg.is-me .chat-msg-author{flex-direction:row-reverse;}
.chat-msg.is-npc .chat-msg-text{background:rgba(30,32,55,.8);border-color:var(--border);}
.chat-msg.is-system .chat-msg-text{background:transparent;border:none;color:var(--text3);font-family:var(--mono);font-size:9px;font-style:italic;margin:0 auto;}
.chat-input-row{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border);}
.chat-input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:6px 10px;font-size:12px;color:var(--text);outline:none;font-family:var(--mono);}
.chat-input:focus{border-color:var(--cyan);}

/* CHAT TOGGLE BTN */
.chat-toggle{position:fixed;bottom:24px;right:24px;z-index:499;width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.5);transition:all .15s;}
.chat-toggle:hover{border-color:var(--cyan);box-shadow:var(--glow-cyan);}
.chat-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center;display:none;}
.chat-badge.show{display:flex;}

/* NPC ACTIVITY FEED */
.feed-container{position:fixed;bottom:24px;left:24px;z-index:400;pointer-events:none;width:300px;}
.feed-item{background:rgba(13,15,24,.95);border:1px solid var(--border2);border-radius:var(--r);padding:8px 12px;margin-bottom:6px;font-family:var(--mono);font-size:10px;color:var(--text2);max-width:300px;backdrop-filter:blur(8px);animation:feedSlide .3s ease;transition:opacity .4s;}
.feed-item.fade{opacity:0;}
.feed-item.race{border-left:2px solid var(--red);}
.feed-item.bid{border-left:2px solid var(--amber2);}
.feed-item.buy{border-left:2px solid var(--green2);}
.feed-item.chat{border-left:2px solid var(--cyan);}
.feed-item.joined{border-left:2px solid var(--purple2);}
@keyframes feedSlide{from{transform:translateX(-20px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r2);padding:24px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.8);}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--red),var(--amber),transparent);}
.modal-title{font-family:var(--disp);font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:3px;margin-bottom:18px;color:var(--red2);}
.modal-close{position:absolute;top:14px;right:14px;font-size:18px;cursor:pointer;color:var(--text3);background:none;border:none;transition:color .15s;}
.modal-close:hover{color:var(--red2);}

/* MISC */
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-family:var(--mono);font-size:11px;letter-spacing:1px;}
.empty-icon{font-size:36px;margin-bottom:10px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--red);border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-screen{display:flex;align-items:center;justify-content:180px;gap:10px;font-family:var(--mono);font-size:11px;color:var(--text3);height:180px;justify-content:center;}
.toast{position:fixed;bottom:80px;right:20px;background:var(--panel2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 16px;font-size:12px;z-index:9000;transform:translateY(60px);opacity:0;transition:all .25s;pointer-events:none;max-width:290px;font-family:var(--mono);box-shadow:0 8px 24px rgba(0,0,0,.6);}
.toast.show{transform:translateY(0);opacity:1;}
.toast.t-success{border-color:rgba(37,128,53,.5);color:var(--green2);}
.toast.t-error{border-color:rgba(212,32,32,.5);color:var(--red2);}
.toast.t-info{border-color:var(--border2);color:var(--steel2);}
.rt-dot{width:6px;height:6px;border-radius:50%;background:var(--red2);display:inline-block;margin-right:5px;animation:rtPulse 2s infinite;}
@keyframes rtPulse{0%,100%{opacity:1;}50%{opacity:.2;}}
.xp-pop{position:fixed;top:70px;right:20px;z-index:8000;font-family:var(--disp);font-size:16px;font-weight:700;color:var(--amber2);pointer-events:none;animation:xpFloat 2s ease forwards;text-shadow:var(--glow-amber);}
@keyframes xpFloat{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);}}
.divider{height:1px;background:var(--border);margin:14px 0;}
.card-mini{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:12px;}
.challenge-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;}
.challenge-icon{font-size:24px;flex-shrink:0;}
.challenge-info{flex:1;}
.challenge-name{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;}
.challenge-prog{height:3px;background:var(--bg3);border-radius:2px;margin-top:6px;overflow:hidden;}
.challenge-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--amber));border-radius:2px;transition:width .5s;}

// ═══ HELPERS ═══
function fmtCash(n){if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return String(Math.round(n));}
function fmtCashFull(n){return Number(n).toLocaleString();}
function fmtCD(date){
  const diff=date-Date.now();
  if(diff<=0)return'ENDED';
  const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
  return h>0?`${h}h ${m}m`:`${m}m ${s}s`;
}
function rcls(r){const m={Common:'badge-common',Rare:'badge-rare',Epic:'badge-epic',Legendary:'badge-gold',Mythic:'badge-mythic'};return m[r]||'badge-common';}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function timeAgo(d){
  if(!d)return'never';
  const s=Math.round((Date.now()-d)/1000);
  if(s<60)return s+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
let _toastTimer=null;
function toast(msg,cls='t-info'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast show '+(cls||'');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),3200);
}
function showXpPop(txt){
  const el=document.createElement('div');

}

// ═══ AUTH ═══
function switchAuthTab(t,el){
  document.querySelectorAll('.auth-tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('auth-login').style.display=t==='login'?'':'none';
  document.getElementById('auth-signup').style.display=t==='signup'?'':'none';
  setMsg('');
}
async function doLogin(){
  const user=document.getElementById('login-user').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!user||!pass){setMsg('Username and password required');return;}
  setMsg('Starting engine...','');
  try{
    const snap=await db.collection('profiles').where('username','==',user).limit(1).get();
    if(snap.empty){setMsg('No account found with that username');return;}
    const prof=snap.docs[0].data();
    if(prof.is_banned){setMsg('Account suspended: '+(prof.ban_reason||'Contact support'));return;}
    if(prof.is_npc){setMsg('That is an NPC account');return;}
    await auth.signInWithEmailAndPassword(prof.email,pass);
  }catch(e){setMsg(e.message);}
}
async function doSignup(){
  const username=document.getElementById('su-user').value.trim();
  const email=document.getElementById('su-email').value.trim();
  const pass=document.getElementById('su-pass').value;
  if(!username||!email||!pass){setMsg('All fields required');return;}
  if(pass.length<6){setMsg('Password must be 6+ characters');return;}
  if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){setMsg('Username: 3-20 chars, letters/numbers/_ only');return;}
  setMsg('Building your profile...','');
  try{
    const taken=await db.collection('profiles').where('username','==',username).limit(1).get();
    if(!taken.empty){setMsg('Username already taken');return;}
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    const uid=cred.user.uid;
    await db.collection('profiles').doc(uid).set({uid,username,email,cash:50000,level:1,xp:0,wins:0,losses:0,win_streak:0,best_win_streak:0,reputation:0,role:'player',is_banned:false,ban_reason:null,is_npc:false,daily_streak:0,last_daily:null,achievements:[],created_at:firebase.firestore.FieldValue.serverTimestamp()});

// ═══ INIT ═══
async function initGame(){
  allCars=CAR_DATA;
  await Promise.all([loadProfile(),ensureMarketSeeded()]);
  await Promise.all([loadPlayerCars(),loadMarketPrices()]);
  renderHUD();renderRaceEvents();renderPlayerCars();
  setupAuctionListener();startMarketTicker();checkDailyBonus();
  startNPCEngine();
  setupChat();
  checkAchievements();
  logActivity('login',{}).catch(()=>{});
}
async function loadProfile(){
  const doc=await db.collection('profiles').doc(currentUser.uid).get();
  if(doc.exists){profile={id:currentUser.uid,...doc.data()};}
  else{
    const username=currentUser.email.split('@')[0];
    profile={id:currentUser.uid,username,email:currentUser.email,cash:50000,level:1,xp:0,wins:0,losses:0,win_streak:0,best_win_streak:0,reputation:0,role:'player',is_banned:false,is_npc:false,daily_streak:0,last_daily:null,achievements:[]};
    await db.collection('profiles').doc(currentUser.uid).set(profile);
  }
}
async function loadPlayerCars(){
  const snap=await db.collection('player_cars').where('player_id','==',currentUser.uid).get();
  playerCars=snap.docs.map(d=>({id:d.id,...d.data()}));
  playerCars.forEach(pc=>{pc.car=allCars.find(c=>c.name===pc.car_name)||null;});
}
async function loadMarketPrices(){
  const snap=await db.collection('market_prices').get();
  marketPrices={};
  snap.docs.forEach(d=>{const mp=d.data();marketPrices[mp.car_name]={id:d.id,...mp};});
  allCars.forEach(c=>{if(!marketPrices[c.name])marketPrices[c.name]={car_name:c.name,current_price:c.base_price,base_price:c.base_price,demand_score:50};});
}
async function ensureMarketSeeded(){
  const snap=await db.collection('market_prices').limit(1).get();
  if(!snap.empty)return;
  const batch=db.batch();
  CAR_DATA.forEach(c=>{batch.set(db.collection('market_prices').doc(),{car_name:c.name,current_price:c.base_price,base_price:c.base_price,demand_score:50,sales_last_24h:0,updated_at:firebase.firestore.FieldValue.serverTimestamp()});});
  await batch.commit();
}
async function giveStarterCar(uid){
  const car=CAR_DATA.find(c=>c.name==='Toyota Supra MK5');if(!car)return;
  await db.collection('player_cars').add({player_id:uid,car_name:car.name,car_class:car.class,car_emoji:car.emoji,purchase_price:0,is_active:true,is_favorite:false,power_boost:0,handling_boost:0,speed_boost:0,upgrades:{},acquired_at:firebase.firestore.FieldValue.serverTimestamp()});
}

// ═══ DAILY BONUS ═══
async function checkDailyBonus(){
  if(!profile)return;
  const last=profile.last_daily?.toDate?.()??null;
  const now=new Date();
  if(last&&last.toDateString()===now.toDateString())return;
  showDailyBonus();
}
function showDailyBonus(){
  if(!profile)return;
  const streak=Math.min((profile.daily_streak||0),DAILY_AMOUNTS.length-1);
  const amount=DAILY_AMOUNTS[streak];
  document.getElementById('daily-amount').textContent='$'+fmtCashFull(amount);
  document.getElementById('daily-streak').textContent=`Day ${streak+1} streak · Come back tomorrow to continue!`;
  const days=['M','T','W','T','F','S','S'];
  document.getElementById('daily-days').innerHTML=days.map((d,i)=>`<div class="daily-day ${i<streak?'done':i===streak?'today':''}">${i<streak?'✓':d}</div>`).join('');
  document.getElementById('daily-banner').classList.add('show');
}
async function claimDaily(){
  if(!profile||!currentUser)return;
  const last=profile.last_daily?.toDate?.()??null;
  const now=new Date();
  if(last&&last.toDateString()===now.toDateString()){toast('Already claimed today!','t-info');document.getElementById('daily-banner').classList.remove('show');return;}
  const yesterday=new Date(now-86400000);
  const newStreak=(last&&last.toDateString()===yesterday.toDateString())?(profile.daily_streak||0)+1:1;
  const idx=Math.min(newStreak-1,DAILY_AMOUNTS.length-1);
  const amount=DAILY_AMOUNTS[idx];
  const newCash=profile.cash+amount;
  await db.collection('profiles').doc(currentUser.uid).update({cash:newCash,daily_streak:newStreak,last_daily:firebase.firestore.Timestamp.now()});
  profile.cash=newCash;profile.daily_streak=newStreak;
  document.getElementById('daily-banner').classList.remove('show');
  renderHUD();
  logActivity('daily_bonus',{amount,streak:newStreak}).catch(()=>{});
  toast(`🎁 Daily bonus: +$${fmtCashFull(amount)}!`,'t-success');
  showXpPop('+$'+fmtCash(amount));
  checkAchievements();
}

// ═══ MARKET ═══
function renderMarket(){
  const grid=document.getElementById('market-grid');
  const q=(document.getElementById('mkt-search')?.value||'').toLowerCase();
  const sort=document.getElementById('mkt-sort')?.value||'demand';
  let filtered=allCars.filter(c=>(currentMktFilter==='all'||c.class===currentMktFilter)&&(!q||c.name.toLowerCase().includes(q)||c.brand.toLowerCase().includes(q)));
  const getPrice=c=>marketPrices[c.name]?.current_price||c.base_price;
  if(sort==='price_asc')filtered.sort((a,b)=>getPrice(a)-getPrice(b));
  else if(sort==='price_desc')filtered.sort((a,b)=>getPrice(b)-getPrice(a));
  else if(sort==='power')filtered.sort((a,b)=>b.power-a.power);
  else if(sort==='speed')filtered.sort((a,b)=>b.top_speed-a.top_speed);
  else filtered.sort((a,b)=>(marketPrices[b.name]?.demand_score||50)-(marketPrices[a.name]?.demand_score||50));
  if(!filtered.length){grid.innerHTML='<div class="empty">No cars match your search.</div>';return;}
  const owned=new Set(playerCars.map(p=>p.car_name));
  grid.innerHTML=filtered.map(c=>{
    const mp=marketPrices[c.name]||{};
    const price=mp.current_price||c.base_price;
    const delta=price-(mp.base_price||c.base_price);
    const dpct=Math.abs((delta/(mp.base_price||c.base_price))*100).toFixed(1);
    const dem=mp.demand_score||50;
    const dc=dem>70?'var(--red2)':dem>45?'var(--amber2)':'var(--green2)';
    const isOwned=owned.has(c.name);
    const canAfford=profile.cash>=price;
    return `<div class="car-card" onclick="viewCar('${c.name}')">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span class="badge ${rcls(c.rarity)}">${c.rarity}</span>
        <span class="badge badge-steel" style="font-size:8px">${c.class}</span>
      </div>
      <div class="car-emoji">${c.emoji}</div>
      <div class="car-name">${c.name}</div>
      <div class="car-brand">${c.brand}</div>
      <div style="font-size:11px;color:var(--text2);margin:4px 0 6px;line-height:1.4">${c.description}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3)">⚡<span style="color:var(--steel2)">${c.power}hp</span></span>
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3)">🏎️<span style="color:var(--steel2)">${c.top_speed}mph</span></span>
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3)">🎯<span style="color:var(--steel2)">${c.handling}</span></span>
      </div>
      <div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--text3);margin-bottom:3px"><span>DEMAND</span><span style="color:${dc}">${Math.round(dem)}/100</span></div>
        <div style="height:3px;background:var(--bg3);border-radius:2px"><div style="height:100%;width:${dem}%;background:${dc};border-radius:2px;transition:width .5s"></div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px">
        <div>
          <div style="font-family:var(--disp);font-size:18px;font-weight:700;color:${canAfford||isOwned?'var(--amber2)':'#884444'}">$${fmtCash(price)}</div>
          <div class="${delta>0?'delta-up':delta<0?'delta-down':''}" style="font-size:9px;font-family:var(--mono)">${delta>0?'▲ +'+dpct+'%':delta<0?'▼ '+dpct+'%':'— base'}</div>
        </div>
        ${isOwned?'<span class="badge badge-green">✓ OWNED</span>':canAfford?`<button class="btn btn-red btn-sm" onclick="event.stopPropagation();buyCar('${c.name}',${price})">Buy</button>`:`<span style="font-family:var(--mono);font-size:9px;color:var(--text3)">Not enough</span>`}
      </div>
      <div class="rarity-strip rarity-${c.rarity.toLowerCase()}"></div>
    </div>`;
  }).join('');
}
function setMktFilter(btn){
  currentMktFilter=btn.dataset.cls;
  document.querySelectorAll('[data-cls]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderMarket();
}
async function buyCar(carName,price){
  if(!profile){toast('Not logged in','t-error');return;}
  if(profile.cash<price){toast('Not enough cash!','t-error');return;}
  if(playerCars.find(p=>p.car_name===carName)){toast('You already own this car!','t-error');return;}
  const car=allCars.find(c=>c.name===carName);if(!car)return;
  await db.collection('player_cars').add({player_id:currentUser.uid,car_name:car.name,car_class:car.class,car_emoji:car.emoji,purchase_price:price,is_active:playerCars.length===0,is_favorite:false,power_boost:0,handling_boost:0,speed_boost:0,upgrades:{},acquired_at:firebase.firestore.FieldValue.serverTimestamp()});
  const newCash=profile.cash-price;
  await db.collection('profiles').doc(currentUser.uid).update({cash:newCash,reputation:firebase.firestore.FieldValue.increment(5)});
  profile.cash=newCash;
  const mp=marketPrices[carName];
  if(mp?.id)db.collection('market_prices').doc(mp.id).update({current_price:Math.round((mp.current_price||price)*1.03),demand_score:Math.min(100,(mp.demand_score||50)+5)}).catch(()=>{});
  await loadPlayerCars();await loadMarketPrices();renderMarket();renderHUD();
  logActivity('buy_car',{car:carName,price}).catch(()=>{});
  toast(`🚗 ${carName} added to your garage!`,'t-success');
  checkAchievements();
}
function startMarketTicker(){
  updateTicker();
  clearInterval(window._mktTick);
  window._mktTick=setInterval(()=>runMarketTick().catch(()=>{}),90000);
}
function updateTicker(){
  const items=Object.values(marketPrices).slice(0,18).map(mp=>{
    const b=mp.base_price||10000,c=mp.current_price||b,d=c-b;
    const col=d>=0?'var(--green2)':'var(--red2)',dir=d>=0?'▲':'▼';
    return `<span style="margin-right:32px"><span style="color:${col}">${dir}</span> <span style="color:var(--steel2)">${mp.car_name}</span> <span style="color:var(--amber2)">$${fmtCash(c)}</span> <span style="color:${col};font-size:9px">${dir}${Math.abs((d/b)*100).toFixed(1)}%</span></span>`;
  }).join('');
  const el=document.getElementById('ticker-text');
  if(el&&items)el.innerHTML=items+items;
}
async function runMarketTick(){
  const batch=db.batch();let cnt=0;
  Object.values(marketPrices).forEach(mp=>{
    const dem=mp.demand_score||50;
    const push=(dem-50)*0.001,walk=(Math.random()-0.495)*0.008,decay=(mp.base_price-mp.current_price)*0.02;
    const newP=Math.max(Math.round(mp.base_price*0.3),Math.round(mp.current_price*(1+push+walk)+decay));
    const newD=Math.max(10,Math.min(100,dem+(Math.random()*4-2)));
    marketPrices[mp.car_name]={...mp,current_price:newP,demand_score:newD};
    if(mp.id&&cnt<10){batch.update(db.collection('market_prices').doc(mp.id),{current_price:newP,demand_score:Math.round(newD),updated_at:firebase.firestore.FieldValue.serverTimestamp()});cnt++;}
  });
  batch.commit().catch(()=>{});
  updateTicker();

async function seedNPCAuctions(){
  if(!currentUser)return;
  const snap=await db.collection('auctions').where('status','==','active').get();
  const now=new Date();
  const active=snap.docs.filter(d=>{const t=d.data().ends_at?.toDate?.();return t&&t>now;});
  const need=Math.max(0,20-active.length);
  if(!need)return;
  const tmpls=[
    {rarities:['Common','Rare'],events:['standard'],durH:[2,4,6],sp:.55,bp:.95},
    {rarities:['Epic'],events:['standard'],durH:[4,6],sp:.6,bp:1.0},
    {rarities:['Legendary','Mythic'],events:['hypercar'],durH:[8,12],sp:.65,bp:1.1},
    {rarities:['Common','Rare'],events:['jdm_night'],durH:[2,4],sp:.5,bp:.9},
    {rarities:['Common','Rare','Epic'],events:['muscle_madness'],durH:[3,5],sp:.52,bp:.92},
  ];
  const batch=db.batch();
  for(let i=0;i<need;i++){
    const tmpl=tmpls[Math.floor(Math.random()*tmpls.length)];
    const cands=CAR_DATA.filter(c=>tmpl.rarities.includes(c.rarity));
    if(!cands.length)continue;
    const car=cands[Math.floor(Math.random()*cands.length)];
    const evt=tmpl.events[Math.floor(Math.random()*tmpl.events.length)];
    const dur=tmpl.durH[Math.floor(Math.random()*tmpl.durH.length)];
    const endsAt=new Date(Date.now()+dur*3600000+Math.random()*3600000);
    const base=(marketPrices[car.name]?.current_price||car.base_price);
    const npc=NPC_NAMES[Math.floor(Math.random()*NPC_NAMES.length)];
    batch.set(db.collection('auctions').doc(),{seller_id:'npc',seller_username:npc+' (NPC)',car_name:car.name,car_emoji:car.emoji,car_class:car.class,car_rarity:car.rarity,event_type:evt,starting_price:Math.round(base*tmpl.sp),current_price:Math.round(base*tmpl.sp),buyout_price:Math.round(base*tmpl.bp),highest_bidder_id:null,highest_bidder_username:null,bid_count:0,status:'active',ends_at:firebase.firestore.Timestamp.fromDate(endsAt),created_at:firebase.firestore.FieldValue.serverTimestamp()});
  }
  await batch.commit().catch(()=>{});
}

// Build a field of NPC racers for a race
function buildRaceField(r){
  // Generate 5 NPC opponents with varied strength
  const diffMults={easy:[0.7,0.75,0.8,0.85,0.9],medium:[0.85,0.9,0.95,1.0,1.05],hard:[0.95,1.0,1.05,1.08,1.12],elite:[1.0,1.05,1.1,1.15,1.2]};
  const mults=diffMults[r.diff]||diffMults.medium;
  const cars=['🏎️','🚗','🚙','🏁','🚕'];
  const names=NPC_NAMES.slice(0,25);
  return mults.map((mult,i)=>{
    const npcName=names[Math.floor(Math.random()*names.length)];
    const baseScore=r.formula?r.formula({power:400,top_speed:180,acceleration:85,handling:80,braking:80}):1000;
    const target=baseScore*mult;
    return {name:npcName,emoji:cars[i]||'🏎️',targetScore:target,isPlayer:false};
  });
}

const RACE_TIPS={drag:'More HP + Turbo upgrades win drags.',circuit:'Handling + HP = circuit king.',street:'Acceleration upgrades are key.',highway:'Max power and top speed builds.',offroad:'SUV/Truck gets a massive +600 bonus.',drift:'Max handling upgrades for drifts.',midnight:'Balance ALL stats for endurance.',ev:'Tesla, Rimac, Lucid get 500pt bonus.'};

async function startRace(rid){
  if(isRacing)return;
  const r=RACE_EVENTS.find(x=>x.id===rid);if(!r)return;
  const pc=playerCars.find(p=>p.is_active)||playerCars[0];
  if(!pc){toast('Set an active car in Garage first!','t-error');return;}
  const c=pc.car||{};
  const s={power:(c.power||300)+(pc.power_boost||0),top_speed:(c.top_speed||150)+(pc.speed_boost||0),acceleration:c.acceleration||50,handling:(c.handling||50)+(pc.handling_boost||0),braking:c.braking||50};
  isRacing=true;

  const arena=document.getElementById('race-arena');
  arena.style.display='block';
  document.getElementById('race-result').style.display='none';
  document.getElementById('scoreboard').style.display='none';
  document.getElementById('arena-title').textContent=r.name;
  setArenaBadge('ready','READY');

  // Build NPC field (5 opponents)
  const npcField=buildRaceField(r);
  const myScore=r.formula(s,c);
  npcField.push({name:profile.username||'YOU',emoji:pc.car_emoji||'🚗',targetScore:myScore,isPlayer:true});

  // Reset bars/lanes
  const trackInner=document.getElementById('track-inner');
  const speedBarSection=document.getElementById('speed-bar-section');

  // Build track lanes for all 6 racers (1 player + 5 NPCs)
  const allRacers=[...npcField].sort(()=>Math.random()-0.5); // random starting order visual
  const playerIndex=allRacers.findIndex(r=>r.isPlayer);

  trackInner.innerHTML=allRacers.map((racer,i)=>{
    const isP=racer.isPlayer;
    return `<div class="track-lane ${isP?'player-lane':''}" id="lane-${i}">
      <div class="lane-road">
        <div class="road-stripe" style="animation:roadAnim ${0.5+Math.random()*0.3}s linear infinite;animation-delay:-${Math.random()*0.5}s"></div>
        <div class="road-stripe" style="animation:roadAnim ${0.5+Math.random()*0.3}s linear infinite;animation-delay:-${Math.random()*0.5}s;left:60%"></div>
      </div>
      <div class="lane-label">${isP?'YOU':racer.name.slice(0,8)}</div>
      <div class="lane-pos" id="lane-pos-${i}">—</div>
      <div class="lane-car ${isP?'is-player':'is-npc'}" id="lane-car-${i}" style="left:3%">${racer.emoji}</div>
      <div class="lane-finish"></div>
    </div>`;
  }).join('');

  // Build speed bars for all
  speedBarSection.innerHTML=allRacers.map((racer,i)=>{
    const isP=racer.isPlayer;
    const hue=isP?'var(--amber)':'var(--red)';
    const fillColor=isP?'linear-gradient(90deg,var(--amber),var(--amber2))':'linear-gradient(90deg,rgba(100,20,20,.8),var(--red2))';
    return `<div class="speed-row">
      <div class="speed-label">
        <span class="speed-name" style="${isP?'color:var(--amber2)':''}">${isP?'🏎️ '+profile.username:racer.emoji+' '+racer.name}</span>
        <span class="speed-score" id="bar-score-${i}"></span>
      </div>
      <div class="speed-track-bar">
        <div class="speed-fill ${isP?'fill-p':'fill-npc'}" id="bar-fill-${i}" style="background:${fillColor}"></div>
      </div>
    </div>`;
  }).join('');

  // Countdown
  const ph=document.getElementById('phase-disp');
  ph.style.display='block';
  setArenaBadge('countdown','COUNTDOWN');
  for(const[i,txt]of['3','2','1','GO!'].entries()){
    await sleep(650);
    ph.textContent=txt;
    ph.className='phase-display '+(i===3?'phase-go':'phase-cd');
  }
  await sleep(250);ph.style.display='none';
  setArenaBadge('racing','RACING');

  // Calculate scores with variance
  const scores=allRacers.map((racer,i)=>{
    if(racer.isPlayer)return{...racer,score:myScore,idx:i};
    const v=racer.targetScore*0.12;
    return{...racer,score:racer.targetScore+(Math.random()*v*2-v),idx:i};
  });
  const maxScore=Math.max(...scores.map(s=>s.score));

  // Animate all at once
  await sleep(100);
  scores.forEach(racer=>{
    const pct=Math.min(88,Math.round((racer.score/maxScore)*88));
    const dur=racer.isPlayer?2.4:2.2+Math.random()*0.8;
    const el=document.getElementById(`lane-car-${racer.idx}`);
    const fill=document.getElementById(`bar-fill-${racer.idx}`);
    const scoreEl=document.getElementById(`bar-score-${racer.idx}`);
    if(el){el.style.transition=`left ${dur}s cubic-bezier(.2,.6,.3,1)`;el.style.left=pct+'%';}
    if(fill){fill.style.transition=`width ${dur}s cubic-bezier(.2,.6,.3,1)`;fill.style.width=pct+'%';}
    if(scoreEl)scoreEl.textContent=Math.round(racer.score);
  });

  await sleep(3200);

  // Sort by score for positions
  const sorted=[...scores].sort((a,b)=>b.score-a.score);
  const playerResult=sorted.find(s=>s.isPlayer);
  const playerPos=sorted.indexOf(playerResult)+1;
  const won=playerPos===1;

  // Show positions in lanes
  sorted.forEach((racer,pos)=>{
    const el=document.getElementById(`lane-pos-${racer.idx}`);
    if(el){
      const medal=['🥇','🥈','🥉'][pos]||(pos+1)+'th';
      el.textContent=medal;
      el.style.color=pos===0?'var(--amber2)':pos===1?'var(--steel)':pos===2?'#cd7f32':'var(--text3)';
    }
  });

  setArenaBadge(won?'victory':'defeat',won?'VICTORY!':playerPos===2?'SO CLOSE!':'DEFEAT');

  // Show scoreboard (top 3 + player)
  document.getElementById('scoreboard').style.display='grid';
  const pBoxName=document.getElementById('score-name-p');
  const pBoxVal=document.getElementById('score-val-p');
  const oBoxName=document.getElementById('opp-name');
  const oBoxVal=document.getElementById('score-val-o');
  pBoxName.textContent=(profile.username||'YOU').toUpperCase();
  pBoxVal.textContent=Math.round(myScore);
  oBoxName.textContent=sorted[0].isPlayer?sorted[1]?.name.toUpperCase():'':sorted[0].name.toUpperCase();
  oBoxVal.textContent=Math.round(sorted[0].isPlayer?sorted[1]?.score:sorted[0].score);
  document.getElementById('score-car-p').textContent=pc.car_emoji||'🚗';
  document.getElementById('opp-emoji').textContent=sorted[0].isPlayer?sorted[1]?.emoji||'🏎️':sorted[0].emoji;
  document.getElementById('score-box-p').className='score-box '+(won?'winner':'loser');
  document.getElementById('score-box-o').className='score-box '+(won?'loser':'winner');

  // Build positions panel
  const posPanel=document.getElementById('race-positions');
  if(posPanel){
    document.getElementById('race-pos-rows').innerHTML=sorted.map((racer,pos)=>`
      <div class="race-pos-row ${racer.isPlayer?'is-you':''}">
        <div class="race-pos-num" style="color:${pos===0?'var(--amber2)':pos===1?'var(--steel)':pos===2?'#cd7f32':'var(--text3)'}">${['🥇','🥈','🥉'][pos]||(pos+1)}</div>
        <div class="race-pos-car">${racer.emoji}</div>
        <div class="race-pos-name" style="${racer.isPlayer?'color:var(--amber2)':''}">${racer.name}${racer.isPlayer?' (YOU)':''}</div>
        <div class="race-pos-score">${Math.round(racer.score)}</div>
      </div>`).join('');
    posPanel.style.display='block';
  }

  // Rewards — scale by position
  const posMulti=[1,0.5,0.25,0,0,0];
  const cashGain=Math.round(r.reward*posMulti[playerPos-1])||0;
  const newCash=profile.cash+cashGain;
  const newWins=(profile.wins||0)+(won?1:0);
  const newLosses=(profile.losses||0)+(won?0:1);
  const newStreak=won?(profile.win_streak||0)+1:0;
  const newBestStreak=Math.max(profile.best_win_streak||0,newStreak);
  const newXp=(profile.xp||0)+r.xp;
  const newLevel=Math.floor(newXp/1000)+1;
  const levUp=newLevel>(profile.level||1);
  const newRep=(profile.reputation||0)+(won?12:3);

  await db.collection('profiles').doc(currentUser.uid).update({cash:newCash,wins:newWins,losses:newLosses,win_streak:newStreak,best_win_streak:newBestStreak,xp:newXp,level:newLevel,reputation:newRep});
  profile={...profile,cash:newCash,wins:newWins,losses:newLosses,win_streak:newStreak,best_win_streak:newBestStreak,xp:newXp,level:newLevel,reputation:newRep};
  db.collection('races').add({player_id:currentUser.uid,player_username:profile.username,car_name:pc.car_name,race_type:r.id,difficulty:r.diff,result:won?'win':'loss',player_score:Math.round(myScore),position:playerPos,total_racers:6,reward:cashGain,xp:r.xp,created_at:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
  logActivity('race',{race:r.name,result:won?'win':'loss',position:playerPos,reward:cashGain}).catch(()=>{});
  renderHUD();

  await sleep(400);
  const resultBox=document.getElementById('race-result');
  resultBox.style.display='block';
  resultBox.className='result-box '+(won?'result-win':'result-lose');
  const posLabel=['','🥇 1st','🥈 2nd','🥉 3rd','4th','5th','6th'][playerPos]||playerPos+'th';
  resultBox.innerHTML=won?`
    <div style="font-size:52px;margin-bottom:10px">🏆</div>
    <div class="result-title">VICTORY</div>
    <div style="font-family:var(--mono);font-size:12px;color:var(--text2);margin:6px 0">Finished ${posLabel} out of 6 racers</div>
    <div class="result-rewards">
      <div class="result-rew-item"><div class="result-rew-val" style="color:var(--amber2)">+$${fmtCash(cashGain)}</div><div class="result-rew-lbl">Cash</div></div>
      <div class="result-rew-item"><div class="result-rew-val" style="color:var(--green2)">+${r.xp}</div><div class="result-rew-lbl">XP</div></div>
      <div class="result-rew-item"><div class="result-rew-val" style="color:var(--purple2)">+12</div><div class="result-rew-lbl">Rep</div></div>
    </div>
    ${newStreak>2?`<div style="font-family:var(--mono);font-size:11px;color:var(--text2)">🔥 ${newStreak}-race win streak!</div>`:''}
    ${levUp?`<div style="margin-top:10px;padding:8px 14px;background:var(--amber3);border:1px solid rgba(200,120,32,.3);border-radius:var(--r);font-family:var(--disp);font-size:14px;font-weight:700;color:var(--amber2)">⬆️ LEVEL UP → ${newLevel}!</div>`:''}`
  :`<div style="font-size:52px;margin-bottom:10px">${playerPos===2?'🥈':'💥'}</div>
    <div class="result-title">${playerPos===2?'SO CLOSE':'DEFEAT'}</div>
    <div style="font-family:var(--mono);font-size:12px;color:var(--text2);margin:6px 0">Finished ${posLabel} out of 6 racers</div>
    <div class="result-rewards">
      ${cashGain>0?`<div class="result-rew-item"><div class="result-rew-val" style="color:var(--amber2)">+$${fmtCash(cashGain)}</div><div class="result-rew-lbl">Cash</div></div>`:''}
      <div class="result-rew-item"><div class="result-rew-val" style="color:var(--green2)">+${r.xp}</div><div class="result-rew-lbl">XP</div></div>
    </div>
    <div style="margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--text3);padding:8px;background:var(--panel2);border-radius:var(--r)">💡 ${RACE_TIPS[r.id]||'Upgrade your car!'}</div>`;
  resultBox.innerHTML+=`<div style="display:flex;gap:8px;justify-content:center;margin-top:16px"><button class="btn btn-ghost" onclick="resetArena()">↺ Race Again</button><button class="btn btn-ghost" onclick="showTab('garage')">🔧 Upgrade</button></div>`;

  if(won){toast(`Victory! +$${fmtCash(cashGain)}`,'t-success');showXpPop(`+${r.xp} XP`);if(levUp)showXpPop('⬆️ LEVEL UP!');}
  else toast(`${posLabel} place — ${RACE_TIPS[r.id]}`,'t-info');
  isRacing=false;
  checkAchievements();
}
function setArenaBadge(type,text){

// ═══ CHALLENGES & ACHIEVEMENTS ═══
async function renderChallenges(){
  const dailyChallenges=[
    {id:'race3',name:'Complete 3 Races',desc:'Win or lose',icon:'🏁',target:3,get:p=>Math.min(3,(p.wins||0)+(p.losses||0)),reward:8000},
    {id:'win2',name:'Win 2 Races Today',desc:'Back-to-back victories',icon:'🏆',target:2,get:p=>Math.min(2,p.wins||0),reward:15000},
    {id:'bid1',name:'Place a Bid',desc:'Bid on any auction',icon:'🔨',target:1,get:()=>0,reward:5000},
    {id:'upgrade1',name:'Buy an Upgrade',desc:'Upgrade any car',icon:'🔧',target:1,get:()=>0,reward:5000},
  ];
  document.getElementById('daily-challenges').innerHTML=dailyChallenges.map(ch=>{
    const prog=ch.get(profile);
    const pct=Math.min(100,(prog/ch.target)*100);
    const done=prog>=ch.target;
    return `<div class="challenge-item"><div class="challenge-icon">${ch.icon}</div><div class="challenge-info"><div class="challenge-name">${ch.name}</div><div style="font-size:11px;color:var(--text2)">${ch.desc}</div><div class="challenge-prog"><div class="challenge-fill" style="width:${pct}%"></div></div><div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:4px">${prog}/${ch.target} · Reward: $${fmtCash(ch.reward)}</div></div>${done?'<span class="badge badge-green">✓ Done</span>':''}</div>`;
  }).join('');

  const weeklyMissions=[
    {name:'Win 15 Races',icon:'🏆',target:15,get:p=>Math.min(15,p.wins||0),reward:50000},
    {name:'Buy 2 Cars',icon:'🚗',target:2,get:(p,pc)=>Math.min(2,pc),reward:30000},
    {name:'Reach Lv.5',icon:'⭐',target:5,get:p=>Math.min(5,p.level||1),reward:25000},
    {name:'Earn $100k',icon:'💰',target:100000,get:p=>Math.min(100000,p.cash||0),reward:20000},
  ];
  document.getElementById('weekly-challenges').innerHTML=weeklyMissions.map(m=>{
    const prog=m.get(profile,playerCars.length);
    const pct=Math.min(100,(prog/m.target)*100);
    const done=prog>=m.target;
    return `<div class="challenge-item"><div class="challenge-icon">${m.icon}</div><div class="challenge-info"><div class="challenge-name">${m.name}</div><div class="challenge-prog"><div class="challenge-fill" style="width:${pct}%"></div></div><div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:4px">${m.target>999?'$'+fmtCash(prog)+' / $'+fmtCash(m.target):prog+'/'+m.target} · Reward: $${fmtCash(m.reward)}</div></div>${done?'<span class="badge badge-green">✓ Done</span>':''}</div>`;
  }).join('');

  document.getElementById('achievements-grid').innerHTML=ACHIEVEMENTS.map(a=>{
    const earned=(profile.achievements||[]).includes(a.id)||(a.check(profile,playerCars.length));
    return `<div class="ach-card ${earned?'earned':''}"><div class="ach-icon">${a.icon}</div><div><div class="ach-name" style="${earned?'color:var(--amber2)':''}">${a.name}</div><div class="ach-desc">${a.desc}</div>${earned?'<div style="font-family:var(--mono);font-size:9px;color:var(--green2);margin-top:3px">✓ Earned!</div>':`<div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:3px">$${fmtCash(a.reward)} reward</div>`}</div></div>`;
  }).join('');
}
async function checkAchievements(){
  if(!profile)return;
  const earned=profile.achievements||[];
  const newlyEarned=[];
  for(const a of ACHIEVEMENTS){
    if(!earned.includes(a.id)&&a.check(profile,playerCars.length)){newlyEarned.push(a);earned.push(a.id);}
  }
  if(newlyEarned.length){
    const totalReward=newlyEarned.reduce((s,a)=>s+a.reward,0);
    await db.collection('profiles').doc(currentUser.uid).update({achievements:earned,cash:firebase.firestore.FieldValue.increment(totalReward)});
    profile.cash+=totalReward;profile.achievements=earned;
    renderHUD();
    newlyEarned.forEach(a=>{
      setTimeout(()=>toast(`🏅 Achievement: ${a.name} · +$${fmtCash(a.reward)}`,'t-success'),300);
      showXpPop(a.icon+' '+a.name);
    });
  }
}

async function loadLeaderboard(){
  const [wSnap,cSnap,sSnap]=await Promise.all([
    db.collection('profiles').orderBy('wins','desc').limit(15).get(),
    db.collection('profiles').orderBy('cash','desc').limit(15).get(),
    db.collection('profiles').orderBy('best_win_streak','desc').limit(15).get()
  ]);
  const row=(d,i,val)=>`<tr><td class="lb-rank">${['🥇','🥈','🥉'][i]||'#'+(i+1)}</td><td><strong>${d.username||'?'}</strong>${d.is_npc?'<span style="font-size:9px;color:var(--text3)"> 🤖</span>':''}${d.id===currentUser.uid?' <span style="font-size:9px;color:var(--red2)">(you)</span>':''}</td><td class="lb-val">${val}</td></tr>`;
  document.getElementById('lb-wins').innerHTML=wSnap.docs.map((d,i)=>row({...d.data(),id:d.id},i,(d.data().wins||0)+' W')).join('');
  document.getElementById('lb-cash').innerHTML=cSnap.docs.map((d,i)=>row({...d.data(),id:d.id},i,'$'+fmtCash(d.data().cash))).join('');
  document.getElementById('lb-streak').innerHTML=sSnap.docs.map((d,i)=>row({...d.data(),id:d.id},i,(d.data().best_win_streak||0)+' 🔥')).join('');
  const gSnap=await db.collection('player_cars').get();
  const counts={};gSnap.docs.forEach(d=>{const p=d.data().player_id;counts[p]=(counts[p]||0)+1;});
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const unames={};
  await Promise.all(top.slice(0,10).map(async([uid])=>{const d=await db.collection('profiles').doc(uid).get();if(d.exists)unames[uid]=d.data();}));
  document.getElementById('lb-garage').innerHTML=top.map(([uid,cnt],i)=>row({...(unames[uid]||{username:'?'}),id:uid},i,cnt+' cars')).join('');
}

// ═══ NPC ENGINE — UNLIMITED + HIGH ACTIVITY ═══
let npcAccounts=[];
let npcActivityLog=[];

async function startNPCEngine(){
  await loadNPCAccounts();
  // If fewer than 30 NPCs exist, spawn some
  if(npcAccounts.length<15){
    const needed=Math.max(0,20-npcAccounts.length);
    for(let i=0;i<needed;i++){
      await maybeCreateNPC(true).catch(()=>{});
      await sleep(200);
    }
  }
  scheduleNPCActivity();
}

async function loadNPCAccounts(){
  const snap=await db.collection('profiles').where('is_npc','==',true).get();
  npcAccounts=snap.docs.map(d=>({id:d.id,...d.data()}));
}

function scheduleNPCActivity(){
  // Racing — every 20-40s
  clearInterval(window._npcRace);
  window._npcRace=setInterval(async()=>{
    if(!currentUser)return;
    const count=1+Math.floor(Math.random()*3); // 1-3 NPCs race simultaneously
    for(let i=0;i<count;i++){
      npcDoRace().catch(()=>{});
      await sleep(500);
    }
  },20000+Math.random()*20000);

  // Bidding — every 15-30s
  clearInterval(window._npcBid);
  window._npcBid=setInterval(async()=>{
    if(!currentUser)return;
    const count=1+Math.floor(Math.random()*2);
    for(let i=0;i<count;i++){
      npcDoBid().catch(()=>{});
      await sleep(300);
    }
  },15000+Math.random()*15000);

  // Buying cars — every 45-90s
  clearInterval(window._npcBuy);
  window._npcBuy=setInterval(()=>{
    if(!currentUser)return;
    npcDoBuyCar().catch(()=>{});
  },45000+Math.random()*45000);

  // Chat messages — every 8-20s
  clearInterval(window._npcChat);
  window._npcChat=setInterval(()=>{
    if(!currentUser)return;
    npcDoChat().catch(()=>{});
  },8000+Math.random()*12000);

  // NPC joining/spawning — every 2-5 min
  clearInterval(window._npcJoin);
  window._npcJoin=setInterval(async()=>{
    if(!currentUser)return;
    // No hard cap on NPC count
    const snap=await db.collection('profiles').where('is_npc','==',true).get().catch(()=>({size:20}));
    if(snap.size<60){
      await maybeCreateNPC(false).catch(()=>{});
      await loadNPCAccounts();
    }
  },120000+Math.random()*180000);

  // NPC upgrades — every 60-120s
  clearInterval(window._npcUpgrade);
  window._npcUpgrade=setInterval(()=>{
    if(!currentUser||!npcAccounts.length)return;
    npcDoUpgrade().catch(()=>{});
  },60000+Math.random()*60000);

  // Kick off immediately
  setTimeout(()=>npcDoRace().catch(()=>{}),3000);
  setTimeout(()=>npcDoBid().catch(()=>{}),6000);
  setTimeout(()=>npcDoChat().catch(()=>{}),9000);
}

function getRandNPC(){
  if(!npcAccounts.length)return null;
  return npcAccounts[Math.floor(Math.random()*npcAccounts.length)];
}

async function npcDoRace(){
  const npc=getRandNPC();if(!npc)return;
  const r=RACE_EVENTS[Math.floor(Math.random()*RACE_EVENTS.length)];
  const won=Math.random()>0.38;
  const cashDelta=won?r.reward:0;
  const newCash=Math.max(500,(npc.cash||5000)+cashDelta);
  const wins=(npc.wins||0)+(won?1:0);
  const losses=(npc.losses||0)+(won?0:1);
  const xp=(npc.xp||0)+r.xp;
  const level=Math.floor(xp/1000)+1;
  await db.collection('profiles').doc(npc.id).update({cash:newCash,wins,losses,xp,level,win_streak:won?(npc.win_streak||0)+1:0,reputation:firebase.firestore.FieldValue.increment(won?12:3)}).catch(()=>{});
  // Update local
  const idx=npcAccounts.findIndex(n=>n.id===npc.id);
  if(idx>=0){npcAccounts[idx]={...npcAccounts[idx],cash:newCash,wins,losses,xp,level};}

  // Log race to races collection
  const carName=npc.activeCar||'Toyota Supra MK5';
  db.collection('races').add({player_id:npc.id,player_username:npc.username,car_name:carName,race_type:r.id,difficulty:r.diff,result:won?'win':'loss',player_score:Math.round(r.formula?r.formula({power:400,top_speed:180,acceleration:85,handling:80,braking:80}):1000),reward:cashDelta,xp:r.xp,is_npc:true,created_at:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});

async function npcDoBid(){
  const npc=getRandNPC();if(!npc)return;
  const aSnap=await db.collection('auctions').where('status','==','active').limit(12).get().catch(()=>null);
  if(!aSnap||aSnap.empty)return;
  const now=new Date();
  const valid=aSnap.docs.filter(d=>{
    const a=d.data();
    const t=a.ends_at?.toDate?.();
    return t&&t>now&&a.seller_id!==npc.id&&a.highest_bidder_id!==npc.id;
  });
  if(!valid.length)return;
  const aDoc=valid[Math.floor(Math.random()*valid.length)];
  const a=aDoc.data();
  const bidAmt=Math.round(a.current_price*(1.04+Math.random()*0.12));
  if((npc.cash||0)<bidAmt)return;
  if(a.highest_bidder_id&&a.highest_bidder_id!==npc.id)
    db.collection('profiles').doc(a.highest_bidder_id).update({cash:firebase.firestore.FieldValue.increment(a.current_price)}).catch(()=>{});
  await Promise.all([
    db.collection('auctions').doc(aDoc.id).update({current_price:bidAmt,highest_bidder_id:npc.id,highest_bidder_username:npc.username,bid_count:firebase.firestore.FieldValue.increment(1)}),
    db.collection('auctions').doc(aDoc.id).collection('bids').add({bidder_id:npc.id,bidder_username:npc.username,amount:bidAmt,created_at:firebase.firestore.FieldValue.serverTimestamp()}),
    db.collection('profiles').doc(npc.id).update({cash:firebase.firestore.FieldValue.increment(-bidAmt)})
  ]).catch(()=>{});
  const idx=npcAccounts.findIndex(n=>n.id===npc.id);
  if(idx>=0)npcAccounts[idx].cash=(npcAccounts[idx].cash||0)-bidAmt;
  showFeed(`🤖 ${npc.username} bid $${fmtCash(bidAmt)} on ${a.car_name}`,'bid');
  if(document.getElementById('tab-auction').classList.contains('active'))renderAuctions();
}

async function npcDoBuyCar(){

    db.collection('profiles').doc(npc.id).update({cash:firebase.firestore.FieldValue.increment(-price)})
  ]).catch(()=>{});
  const idx=npcAccounts.findIndex(n=>n.id===npc.id);
  if(idx>=0)npcAccounts[idx].cash=(npcAccounts[idx].cash||0)-price;
  showFeed(`🤖 ${npc.username} bought a ${car.emoji} ${car.name}`,'buy');
