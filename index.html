cat > /tmp/p1.html << 'PYEOF'
python3 - << 'EOF'
content = r'''


<meta>
<meta>
<title>REDLINE — Street Racing</title>
<style>
:root{
--bg:#0a0a0f;--bg2:#0f0f17;--bg3:#13131e;--panel:#16161f;--panel2:#1a1a26;--panel3:#1e1e2e;
--border:#1e1e30;--border2:#252538;--border3:#2a2a42;
--red:#d42020;--red2:#e63535;--red3:rgba(212,32,32,.12);--red4:rgba(212,32,32,.06);
--amber:#c87820;--amber2:#e8922a;--amber3:rgba(200,120,32,.1);
--green:#1a8a3a;--green2:#22aa4a;--green3:rgba(26,138,58,.12);
--blue:#1a4a8a;--blue2:#3a7adc;--blue3:rgba(26,74,138,.12);
--purple:#5a2a8a;--purple2:#8a4adc;--purple3:rgba(90,42,138,.12);
--steel:#4a5a7a;--steel2:#7a9aca;--steel3:rgba(74,90,122,.12);
--text:#e8e8f0;--text2:#a8a8c0;--text3:#6a6a88;--text4:#3a3a55;
--disp:'Rajdhani',sans-serif;--mono:'JetBrains Mono',monospace;--body:'Inter',sans-serif;
--r:8px;--r2:12px;--r3:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;overflow-x:hidden;}
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border3);border-radius:2px;}

/* ── AUTH ── */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 30% 20%,rgba(212,32,32,.08) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(90,42,138,.06) 0%,transparent 60%),var(--bg);}
.auth-wrap{width:100%;max-width:420px;padding:20px;}
.auth-logo{text-align:center;margin-bottom:32px;}
.auth-logo-mark{font-family:var(--disp);font-size:52px;font-weight:700;letter-spacing:6px;color:var(--red2);text-shadow:0 0 40px rgba(212,32,32,.4);line-height:1;}
.auth-logo-sub{font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--text3);margin-top:6px;text-transform:uppercase;}
.auth-card{background:var(--panel);border:1px solid var(--border2);border-radius:var(--r3);overflow:hidden;}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);}
.auth-tab{flex:1;padding:14px;font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border:none;background:transparent;color:var(--text3);cursor:pointer;transition:all .2s;}
.auth-tab.active{color:var(--red2);background:var(--red4);border-bottom:2px solid var(--red2);}
.auth-body{padding:24px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:6px;}
.form-input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--body);font-size:14px;outline:none;transition:border .2s;}
.form-input:focus{border-color:var(--red2);box-shadow:0 0 0 3px var(--red4);}
.form-input::placeholder{color:var(--text4);}
.auth-msg{padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:14px;display:none;}
.auth-msg.err{background:var(--red3);border:1px solid rgba(212,32,32,.2);color:#ff8888;}
.auth-msg.ok{background:var(--green3);border:1px solid rgba(26,138,58,.2);color:#88ffaa;}
.auth-msg.info{background:var(--steel3);border:1px solid rgba(74,90,122,.2);color:var(--steel2);}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;border-radius:var(--r);font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:var(--red2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(212,32,32,.3);}
.btn-gold{background:linear-gradient(135deg,var(--amber),var(--amber2));color:#fff;}
.btn-gold:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2);}
.btn-ghost:hover{border-color:var(--border3);color:var(--text);background:var(--panel2);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:var(--green2);}
.btn-steel{background:var(--steel3);border:1px solid var(--border2);color:var(--steel2);}
.btn-steel:hover{background:var(--steel);color:#fff;}
.btn-purple{background:var(--purple3);border:1px solid rgba(90,42,138,.3);color:var(--purple2);}
.btn-purple:hover{background:var(--purple);color:#fff;}
.btn-blue{background:var(--blue3);border:1px solid rgba(26,74,138,.3);color:var(--blue2);}
.btn-blue:hover{background:var(--blue);color:#fff;}
.btn-sm{padding:6px 12px;font-size:11px;}
.btn-lg{padding:14px 28px;font-size:15px;width:100%;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;}

/* ── GAME LAYOUT ── */
#game{display:none;min-height:100vh;flex-direction:column;}
.hud{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0;height:56px;padding:0 16px;}
.hud-logo{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:3px;color:var(--red2);text-shadow:0 0 20px rgba(212,32,32,.3);margin-right:20px;flex-shrink:0;}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:8px 14px;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:1px;color:var(--text3);background:transparent;border:none;cursor:pointer;border-radius:var(--r);white-space:nowrap;transition:all .15s;position:relative;}
.nav-tab.active{color:var(--red2);background:var(--red4);}
.nav-tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--red2);}
.nav-tab:hover:not(.active){color:var(--text);background:var(--panel2);}
.hud-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto;}
.hud-stat{display:flex;align-items:center;gap:5px;padding:5px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);font-family:var(--mono);font-size:11px;}
.hud-cash-val{color:var(--amber2);font-weight:700;}
.hud-lv{color:var(--steel2);}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--purple));border:2px solid var(--border2);color:#fff;font-family:var(--disp);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;}

/* ── TICKER ── */
.ticker-wrap{background:var(--panel);border-bottom:1px solid var(--border);height:28px;overflow:hidden;position:relative;}
.ticker-wrap::before,.ticker-wrap::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:2;}
.ticker-wrap::before{left:0;background:linear-gradient(to right,var(--panel),transparent);}
.ticker-wrap::after{right:0;background:linear-gradient(to left,var(--panel),transparent);}
.ticker-inner{display:flex;height:100%;align-items:center;animation:tickerScroll 60s linear infinite;}
.ticker-inner:hover{animation-play-state:paused;}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{flex-shrink:0;padding:0 20px;font-family:var(--mono);font-size:10px;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.t-up{color:var(--green2);}
.t-down{color:var(--red2);}
.t-flat{color:var(--text3);}
.t-car{color:var(--steel2);}
.t-price{color:var(--amber2);font-weight:700;}

/* ── SECTIONS ── */
.section{display:none;padding:24px 16px;max-width:1400px;margin:0 auto;width:100%;}
.section.active{display:block;}
.section-title{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:2px;color:var(--text);margin-bottom:4px;text-transform:uppercase;}
.section-sub{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1.5px;margin-bottom:20px;}

/* ── CARDS ── */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:16px;position:relative;overflow:hidden;transition:border .2s;}
.card:hover{border-color:var(--border3);}
.card-sm{padding:12px;}
.card-lg{padding:20px;}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.badge-common{background:rgba(100,100,140,.15);color:#9090b8;border:1px solid rgba(100,100,140,.2);}
.badge-rare{background:rgba(26,74,138,.15);color:var(--blue2);border:1px solid rgba(26,74,138,.2);}
.badge-epic{background:rgba(90,42,138,.15);color:var(--purple2);border:1px solid rgba(90,42,138,.2);}
.badge-legendary{background:rgba(200,120,32,.15);color:var(--amber2);border:1px solid rgba(200,120,32,.2);}
.badge-mythic{background:rgba(212,32,32,.15);color:var(--red2);border:1px solid rgba(212,32,32,.2);}
.badge-green{background:var(--green3);color:var(--green2);border:1px solid rgba(26,138,58,.2);}
.badge-red{background:var(--red3);color:var(--red2);border:1px solid rgba(212,32,32,.2);}
.badge-steel{background:var(--steel3);color:var(--steel2);border:1px solid rgba(74,90,122,.2);}
.badge-gold{background:var(--amber3);color:var(--amber2);border:1px solid rgba(200,120,32,.2);}

/* ── GRIDS ── */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.grid-auto-lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
@media(max-width:768px){
.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
.grid-auto{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
.grid-auto-lg{grid-template-columns:1fr;}
.hud-stat.hide-sm{display:none;}
}

/* ── CAR CARD ── */
.car-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:16px;cursor:pointer;position:relative;overflow:hidden;transition:all .2s;}
.car-card:hover{border-color:var(--red2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,32,32,.1);}
.car-card.selected{border-color:var(--red2);background:var(--panel2);box-shadow:0 0 0 2px rgba(212,32,32,.2);}
.car-emoji{font-size:44px;line-height:1;margin:8px 0;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4));}
.car-name{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.5px;margin-bottom:2px;}
.car-brand{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.car-price{font-family:var(--disp);font-size:20px;font-weight:700;color:var(--amber2);}
.rarity-bar{position:absolute;bottom:0;left:0;right:0;height:3px;}
.rarity-bar.common{background:rgba(100,100,140,.4);}
.rarity-bar.rare{background:linear-gradient(90deg,var(--blue),var(--blue2));}
.rarity-bar.epic{background:linear-gradient(90deg,var(--purple),var(--purple2));}
.rarity-bar.legendary{background:linear-gradient(90deg,var(--amber),var(--amber2));}
.rarity-bar.mythic{background:linear-gradient(90deg,var(--red),var(--red2),var(--amber2));}
.sel-tag{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:1.5px;padding:3px 7px;border-radius:4px;}

/* ── STAT BARS ── */
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.stat-lbl{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--text3);width:62px;flex-shrink:0;text-transform:uppercase;}
.stat-bar-bg{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.2,.8,.3,1);}
.stat-val{font-family:var(--mono);font-size:10px;color:var(--text2);width:52px;text-align:right;flex-shrink:0;}

/* ── RACE CARDS ── */
.race-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.race-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:all .2s;}
.race-card:hover{border-color:var(--red2);transform:translateY(-2px);box-shadow:0 8px 30px rgba(212,32,32,.12);}
.race-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 60%,rgba(212,32,32,.04));pointer-events:none;}
.race-diff{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:1.5px;margin-bottom:10px;}
.diff-easy{background:var(--green3);color:var(--green2);border:1px solid rgba(26,138,58,.2);}
.diff-medium{background:var(--amber3);color:var(--amber2);border:1px solid rgba(200,120,32,.2);}
.diff-hard{background:var(--red3);color:var(--red2);border:1px solid rgba(212,32,32,.2);}
.diff-elite{background:var(--purple3);color:var(--purple2);border:1px solid rgba(90,42,138,.2);}
.race-emoji{font-size:36px;line-height:1;margin-bottom:10px;display:block;}
.race-name{font-family:var(--disp);font-size:18px;font-weight:700;letter-spacing:.5px;margin-bottom:4px;}
.race-desc{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:14px;}
.race-footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;}
.race-reward{font-family:var(--disp);font-size:16px;font-weight:700;color:var(--amber2);}
.race-xp{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:2px;}

/* ── RACE ARENA ── */
#race-arena{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.arena-header{width:100%;max-width:700px;display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
.arena-title{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:2px;color:var(--text);text-transform:uppercase;}
.arena-badge{padding:5px 14px;border-radius:20px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:2px;}
.ab-ready{background:var(--steel3);color:var(--steel2);border:1px solid rgba(74,90,122,.3);}
.ab-countdown{background:var(--amber3);color:var(--amber2);border:1px solid rgba(200,120,32,.3);}
.ab-racing{background:var(--red3);color:var(--red2);border:1px solid rgba(212,32,32,.3);animation:pulse 1s infinite;}
.ab-victory{background:var(--green3);color:var(--green2);border:1px solid rgba(26,138,58,.3);}
.ab-defeat{background:var(--red3);color:var(--red2);border:1px solid rgba(212,32,32,.3);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.race-track{width:100%;max-width:700px;margin-bottom:20px;}
.track-lane{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden;min-height:64px;}
.track-lane-bg{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,.01) 40px,rgba(255,255,255,.01) 41px);}
.lane-label{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:8px;}
.lane-bar-bg{height:8px;background:var(--bg3);border-radius:4px;position:relative;overflow:hidden;}
.lane-bar-fill{height:100%;width:0%;border-radius:4px;transition:width 2.5s cubic-bezier(.1,.8,.2,1);position:relative;}
.lane-fill-p{background:linear-gradient(90deg,var(--red),var(--red2),var(--amber2));}
.lane-fill-o{background:linear-gradient(90deg,var(--steel),var(--steel2));}
.lane-car{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;z-index:4;line-height:1;filter:drop-shadow(0 0 8px rgba(212,32,32,.5));transition:left 2.5s cubic-bezier(.1,.8,.2,1);left:3%;}
.lane-score{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:6px;text-align:right;}
.phase-disp{font-family:var(--disp);font-size:80px;font-weight:700;color:var(--red2);text-align:center;text-shadow:0 0 60px rgba(212,32,32,.5);animation:phaseIn .4s ease;}
@keyframes phaseIn{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.phase-go{color:var(--green2);text-shadow:0 0 60px rgba(26,138,58,.5);}
.scoreboard{display:none;width:100%;max-width:700px;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:20px;}
.score-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:14px;text-align:center;}
.score-box.winner{border-color:var(--green2);background:rgba(26,138,58,.05);}
.score-box.loser{border-color:var(--red2);background:rgba(212,32,32,.05);}
.score-vs{font-family:var(--disp);font-size:28px;font-weight:700;color:var(--text3);text-align:center;}
.score-name{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;}
.score-val{font-family:var(--disp);font-size:32px;font-weight:700;}
.result-box{width:100%;max-width:700px;border-radius:var(--r2);padding:24px;text-align:center;}
.result-win{background:linear-gradient(135deg,rgba(26,138,58,.1),rgba(26,138,58,.05));border:1px solid rgba(26,138,58,.3);}
.result-lose{background:linear-gradient(135deg,rgba(212,32,32,.08),rgba(212,32,32,.04));border:1px solid rgba(212,32,32,.2);}
.result-title{font-family:var(--disp);font-size:36px;font-weight:700;letter-spacing:3px;margin-bottom:16px;}
.result-rewards{display:flex;justify-content:center;gap:24px;margin-bottom:16px;flex-wrap:wrap;}
.rew-item{text-align:center;}
.rew-val{font-family:var(--disp);font-size:24px;font-weight:700;}
.rew-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.result-tip{margin-top:12px;padding:10px 14px;background:var(--panel2);border-radius:var(--r);font-family:var(--mono);font-size:11px;color:var(--text2);}
.result-actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

/* ── GARAGE SIDEBAR ── */
.garage-layout{display:grid;grid-template-columns:1fr 340px;gap:20px;}
@media(max-width:900px){.garage-layout{grid-template-columns:1fr;}}
.sidebar{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:20px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto;}
.sidebar-car-emoji{font-size:64px;text-align:center;margin:12px 0;filter:drop-shadow(0 4px 16px rgba(212,32,32,.2));}
.sidebar-car-name{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:.5px;text-align:center;margin-bottom:4px;}
.upgrade-tab{padding:6px 12px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;border:1px solid var(--border2);background:transparent;color:var(--text3);border-radius:var(--r);cursor:pointer;transition:all .15s;}
.upgrade-tab.active{border-color:var(--red2);color:var(--red2);background:var(--red4);}
.upgrade-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;gap:10px;}
.upg-name{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.3px;margin-bottom:2px;}
.upg-meta{font-family:var(--mono);font-size:9px;color:var(--text3);}
.upg-dots{display:flex;gap:3px;margin-top:5px;}
.upg-dot{width:8px;height:8px;border-radius:50%;background:var(--border3);border:1px solid var(--border2);}
.upg-dot.filled{background:var(--red2);border-color:var(--red);}

/* ── MARKET ── */

// ══ HELPERS ══
const fc=n=>{if(!n&&n!==0)return'0';n=Math.round(n);if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'k';return n.toLocaleString();};
const fcf=n=>Math.round(n).toLocaleString();
const rcls=r=>({Common:'badge-common',Rare:'badge-rare',Epic:'badge-epic',Legendary:'badge-legendary',Mythic:'badge-mythic'}[r]||'badge-common');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const timeAgo=d=>{if(!d)return'?';const s=Math.floor((Date.now()-d)/1000);if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';};
const fmtCD=e=>{const s=Math.max(0,Math.floor((e-Date.now())/1000));if(!s)return'ENDED';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?h+'h '+m+'m':m+'m '+String(sec).padStart(2,'0')+'s';};

function toast(msg,cls='t-info'){
  const t=document.createElement('div');
  t.className='toast '+cls;t.textContent=msg;
  document.getElementById('toast-wrap').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(100%)';setTimeout(()=>t.remove(),400);},3200);
}
function xpPop(msg){
  const el=document.createElement('div');el.className='xp-pop';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),1500);
}
function openModal(id){document.getElementById(id).style.display='flex';}
function closeModal(id){document.getElementById(id).style.display='none';}
function feed(msg){
  const f=document.getElementById('npc-feed');if(!f)return;
  const item=document.createElement('div');item.className='feed-item';item.textContent=msg;
  f.appendChild(item);
  while(f.children.length>4)f.removeChild(f.firstChild);
  setTimeout(()=>{item.classList.add('fade');setTimeout(()=>item.remove(),300);},8000);
}

// ══ AUTH ══
function authTab(t,el){
  document.querySelectorAll('.auth-tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('auth-login').style.display=t==='login'?'':'none';
  document.getElementById('auth-signup').style.display=t==='signup'?'':'none';
  setAuthMsg('');
}
function setAuthMsg(msg,type='err'){
  const el=document.getElementById('auth-msg');
  el.textContent=msg;el.style.display=msg?'block':'none';
  el.className='auth-msg '+(type==='ok'?'ok':type===''?'info':'err');
}
async function doLogin(){
  const user=document.getElementById('l-user').value.trim();
  const pass=document.getElementById('l-pass').value;
  if(!user||!pass){setAuthMsg('Username and password required');return;}
  setAuthMsg('Starting engine...','');
  try{
    const snap=await db.collection('profiles').where('username','==',user).limit(1).get();
    if(snap.empty){setAuthMsg('No account with that username');return;}
    const prof=snap.docs[0].data();
    if(prof.is_banned){setAuthMsg('Account suspended: '+(prof.ban_reason||'Contact support'));return;}
    if(prof.is_npc){setAuthMsg('That is an NPC account');return;}
    await auth.signInWithEmailAndPassword(prof.email,pass);
  }catch(e){setAuthMsg(e.message);}
}
async function doSignup(){
  const username=document.getElementById('s-user').value.trim();
  const email=document.getElementById('s-email').value.trim();
  const pass=document.getElementById('s-pass').value;
  if(!username||!email||!pass){setAuthMsg('All fields required');return;}
  if(pass.length<6){setAuthMsg('Password must be 6+ characters');return;}
  if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){setAuthMsg('Username: 3-20 chars, letters/numbers/_ only');return;}
  setAuthMsg('Building your profile...','');
  try{
    const taken=await db.collection('profiles').where('username','==',username).limit(1).get();
    if(!taken.empty){setAuthMsg('Username already taken');return;}
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    const uid=cred.user.uid;
    await db.collection('profiles').doc(uid).set({uid,username,email,cash:50000,level:1,xp:0,wins:0,losses:0,streak:0,best_streak:0,rep:0,role:'player',is_banned:false,ban_reason:null,is_npc:false,daily_streak:0,last_daily:null,achievements:[],created_at:firebase.firestore.FieldValue.serverTimestamp()});
    await giveStarterCar(uid);
    setAuthMsg('Welcome to REDLINE! 🏎️','ok');
  }catch(e){setAuthMsg(e.message);}
}
async function doLogout(){
  try{await logAct('logout',{});}catch{}
  await auth.signOut();
}

// ══ BOOT ══
async function boot(){
  AllCars=CARS;
  await Promise.all([loadProfile(),seedMarket()]);
  await Promise.all([loadPCars(),loadMktPrices()]);
  renderHUD();renderRaces();renderGarage();
  setupAuctListener();startMktTicker();checkDaily();
  startNPC();checkAchs();
  logAct('login',{}).catch(()=>{});
}
async function loadProfile(){
  const doc=await db.collection('profiles').doc(CU.uid).get();
  if(doc.exists){P={id:CU.uid,...doc.data()};}
  else{
    const username=CU.email.split('@')[0];
    P={id:CU.uid,username,email:CU.email,cash:50000,level:1,xp:0,wins:0,losses:0,streak:0,best_streak:0,rep:0,role:'player',is_banned:false,is_npc:false,daily_streak:0,last_daily:null,achievements:[]};
    await db.collection('profiles').doc(CU.uid).set(P);
  }
}
async function loadPCars(){
  const snap=await db.collection('player_cars').where('player_id','==',CU.uid).get();
  PCars=snap.docs.map(d=>({id:d.id,...d.data()}));
  PCars.forEach(pc=>{pc.car=CARS.find(c=>c.n===pc.car_name)||null;});
}
async function loadMktPrices(){
  const snap=await db.collection('market_prices').get();
  MktPrices={};
  snap.docs.forEach(d=>{const mp=d.data();MktPrices[mp.car_name]={id:d.id,...mp};});
  CARS.forEach(c=>{if(!MktPrices[c.n])MktPrices[c.n]={car_name:c.n,current_price:c.p,base_price:c.p,demand_score:50};});
}
async function seedMarket(){
  const snap=await db.collection('market_prices').limit(1).get();
  if(!snap.empty)return;
  const batch=db.batch();
  CARS.forEach(c=>{batch.set(db.collection('market_prices').doc(),{car_name:c.n,current_price:c.p,base_price:c.p,demand_score:50,updated_at:firebase.firestore.FieldValue.serverTimestamp()});});
  await batch.commit();
}
async function giveStarterCar(uid){
  const car=CARS.find(c=>c.n==='Toyota Supra MK5');if(!car)return;
  await db.collection('player_cars').add({player_id:uid,car_name:car.n,car_class:car.cl,car_emoji:car.e,purchase_price:0,is_active:true,is_fav:false,pb:0,hb:0,sb:0,upgrades:{},acquired_at:firebase.firestore.FieldValue.serverTimestamp()});
}

// ══ DAILY ══
function checkDaily(){
  if(!P)return;
  const last=P.last_daily?.toDate?.()??null;
  if(last&&last.toDateString()===new Date().toDateString())return;
  showDailyBanner();
}
function showDailyBanner(){
  if(!P)return;
  const streak=Math.min(P.daily_streak||0,DAILY.length-1);
  const amt=DAILY[streak];
  document.getElementById('daily-amount').textContent='$'+fcf(amt);
  document.getElementById('daily-streak-txt').textContent=`Day ${streak+1} · Come back tomorrow to continue!`;
  const days=['M','T','W','T','F','S','S'];
  document.getElementById('daily-days').innerHTML=days.map((d,i)=>`<div class="daily-day ${i<streak?'done':i===streak?'today':''}">${i<streak?'✓':d}</div>`).join('');
  document.getElementById('daily-banner').classList.add('show');
}
async function claimDaily(){
  if(!P||!CU)return;
  const last=P.last_daily?.toDate?.()??null;
  const now=new Date();
  if(last&&last.toDateString()===now.toDateString()){
    toast('Already claimed today!','t-info');
    document.getElementById('daily-banner').classList.remove('show');return;
  }
  const yest=new Date(now-86400000);
  const newStreak=(last&&last.toDateString()===yest.toDateString())?(P.daily_streak||0)+1:1;
  const idx=Math.min(newStreak-1,DAILY.length-1);
  const amt=DAILY[idx];
  const newCash=P.cash+amt;
  await db.collection('profiles').doc(CU.uid).update({cash:newCash,daily_streak:newStreak,last_daily:firebase.firestore.Timestamp.now()});
  P.cash=newCash;P.daily_streak=newStreak;
  document.getElementById('daily-banner').classList.remove('show');
  renderHUD();
  toast(`🎁 Daily bonus: +$${fcf(amt)}!`,'t-gold');
  xpPop('+$'+fc(amt));
  logAct('daily',{amount:amt,streak:newStreak}).catch(()=>{});
  checkAchs();
}

// ══ HUD ══
function renderHUD(){
  if(!P)return;
  document.getElementById('hud-cash').textContent=fc(P.cash);
  document.getElementById('hud-lv').textContent=P.level||1;
  const init=(P.username||'R')[0].toUpperCase();
  document.getElementById('avatar-init').textContent=init;
  document.getElementById('prof-av').textContent=init;
  document.getElementById('menu-name').textContent=P.username||'Driver';
  document.getElementById('menu-role').innerHTML=roleBadge(P.role);
  const active=PCars.find(p=>p.is_active);
  if(active){
    const pill=document.getElementById('active-car-pill');
    pill.style.display='';
    document.getElementById('ac-emoji').textContent=active.car_emoji||'🚗';
    document.getElementById('ac-name').textContent=active.car_name||'';
    document.getElementById('r-player').textContent=active.car_emoji||'🚗';
  }
  const isAdm=['admin','owner'].includes(P.role);
  document.getElementById('admin-tab').style.display=isAdm?'':'none';
  document.getElementById('admin-menu-link').style.display=isAdm?'':'none';
  const av=document.getElementById('avatar-btn');
  av.style.border=P.role==='owner'?'2px solid var(--purple2)':P.role==='admin'?'2px solid var(--red2)':P.role==='moderator'?'2px solid var(--amber2)':'2px solid var(--border2)';
}
function roleBadge(role){
  const L={owner:'👑 Owner',admin:'🛡️ Admin',moderator:'⚔️ Mod',player:'🏎️ Player',npc:'🤖 NPC'};
  return `<span class="role-badge role-${role||'player'}">${L[role]||'Player'}</span>`;
}

// ══ NAV ══
function showTab(t,el){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  const sec=document.getElementById('tab-'+t);
  if(sec)sec.classList.add('active');
  if(el)el.classList.add('active');
  closeMenu();
  if(t==='garage')renderGarage();
  if(t==='market'){loadMktPrices().then(renderMarket);runMktTick();}
  if(t==='auction')renderAuctions();
  if(t==='leaderboard')loadLB();
  if(t==='profile')renderProfile();
  if(t==='admin')loadAdmin();
  if(t==='challenges')renderChallenges();
}
function toggleMenu(){document.getElementById('hud-menu').classList.toggle('open');}
function closeMenu(){document.getElementById('hud-menu').classList.remove('open');}
document.addEventListener('click',e=>{if(!document.getElementById('avatar-btn').contains(e.target))closeMenu();});

// ══ GARAGE ══
function renderGarage(){
  const grid=document.getElementById('garage-grid');
  document.getElementById('garage-count').textContent=PCars.length;
  if(!PCars.length){
    grid.innerHTML='<div class="empty"><div class="empty-icon">🏠</div>Your garage is empty!<br><br><button class="btn btn-red" onclick="showTab('market')">Browse Cars →</button></div>';
    document.getElementById('garage-sidebar').style.display='none';return;
  }
  grid.innerHTML=PCars.map(pc=>`
    <div class="car-card ${pc.id===selCar?'selected':''}" onclick="selectCar('${pc.id}')">
      ${pc.is_active?'<div class="sel-tag">ACTIVE</div>':''}
      ${pc.is_fav?'<div style="position:absolute;top:8px;left:8px;font-size:12px">❤️</div>':''}
      <div class="car-emoji">${pc.car_emoji||'🚗'}</div>
      <div class="car-name">${pc.car_name||'?'}</div>
      <div class="car-brand">${pc.car?.b||''} · ${pc.car?.cl||''}</div>
      <span class="badge ${rcls(pc.car?.r)}">${pc.car?.r||''}</span>
      ${pc.pb?`<div style="font-family:var(--mono);font-size:9px;color:var(--red2);margin-top:4px">+${pc.pb}hp modified</div>`:''}
      <div class="rarity-bar ${(pc.car?.r||'common').toLowerCase()}"></div>
    </div>`).join('');
  if(selCar)showSidebar(selCar);
}
function selectCar(id){selCar=id;renderGarage();showSidebar(id);}
function showSidebar(id){
  const pc=PCars.find(x=>x.id===id);if(!pc)return;
