function showFeed(msg,type='race'){
  const feed=document.getElementById('npc-feed');if(!feed)return;
  const item=document.createElement('div');
  item.className=`feed-item ${type}`;item.textContent=msg;
  feed.insertBefore(item,feed.firstChild);
  while(feed.children.length>6)feed.removeChild(feed.lastChild);
  setTimeout(()=>{item.classList.add('fade');setTimeout(()=>item.remove(),400);},10000);
}

// ═══ CHAT ═══
function setupChat(){
  const chatPanel=document.getElementById('chat-panel');
  // Listen for real-time chat messages
  if(chatMsgUnsub){chatMsgUnsub();chatMsgUnsub=null;}
  chatMsgUnsub=db.collection('chat_messages')
    .orderBy('created_at','desc')
    .limit(60)
    .onSnapshot(snap=>{
      renderChatMessages(snap.docs.reverse());
      if(!chatOpen&&snap.docs.length>0){
        unreadChat++;
        const badge=document.getElementById('chat-badge');
        if(badge&&unreadChat>0){badge.textContent=unreadChat>9?'9+':unreadChat;badge.classList.add('show');}
      }
    },err=>console.warn('Chat listener:',err.message));
}

function renderChatMessages(docs){
  const container=document.getElementById('chat-messages');if(!container)return;
  const wasAtBottom=container.scrollHeight-container.scrollTop<=container.clientHeight+50;
  container.innerHTML=docs.map(d=>{
    const m=d.data();
    const isMe=m.author_id===currentUser?.uid;
    const isNPC=m.is_npc;
    const isSystem=m.is_system;
    const roleColor=m.role==='admin'||m.role==='owner'?'var(--red2)':m.role==='moderator'?'var(--amber2)':isNPC?'var(--text3)':'var(--steel2)';
    const roleLabel=m.role==='admin'?'[ADM]':m.role==='owner'?'[OWN]':m.role==='moderator'?'[MOD]':isNPC?'[BOT]':'';
    if(isSystem)return`<div class="chat-msg is-system"><div class="chat-msg-text">${m.text}</div></div>`;
    return`<div class="chat-msg ${isMe?'is-me':isNPC?'is-npc':''}">
      <div class="chat-msg-author">
        <span style="color:${roleColor};font-size:9px">${roleLabel?roleLabel+' ':''}</span>
        <span style="color:${roleColor}">${m.author||'?'}</span>
        <span style="color:var(--text4)">${timeAgo(m.created_at?.toDate())}</span>
      </div>
      <div class="chat-msg-text">${escapeHtml(m.text||'')}</div>
    </div>`;
  }).join('');
  if(wasAtBottom)container.scrollTop=container.scrollHeight;
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function toggleChat(){
  chatOpen=!chatOpen;
  const panel=document.getElementById('chat-panel');
  const toggle=document.getElementById('chat-toggle-btn');
  if(chatOpen){
    panel.classList.add('open');
    toggle.style.display='none';
    unreadChat=0;
    const badge=document.getElementById('chat-badge');
    if(badge)badge.classList.remove('show');
    setTimeout(()=>{const c=document.getElementById('chat-messages');if(c)c.scrollTop=c.scrollHeight;},100);
  }else{
    panel.classList.remove('open');
    toggle.style.display='flex';
  }
}

async function sendChatMsg(){
  if(!currentUser||!profile)return;
  const input=document.getElementById('chat-input');
  const text=(input?.value||'').trim();
  if(!text)return;
  if(text.length>200){toast('Message too long (200 chars max)','t-error');return;}
  input.value='';
  await db.collection('chat_messages').add({
    author_id:currentUser.uid,
    author:profile.username,
    text,
    is_npc:false,
    role:profile.role||'player',
    created_at:firebase.firestore.FieldValue.serverTimestamp()
  }).catch(e=>toast(e.message,'t-error'));
}

function chatKeydown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMsg();}}

          <div style="font-size:12px;color:var(--text);margin-top:2px">${m.text||''}</div>
        </div>
        <button class="btn btn-sm" style="background:var(--red3);color:var(--red2);border:1px solid rgba(212,32,32,.2);flex-shrink:0" onclick="deleteMsg('${m.id}')">Del</button>
      </div>`).join('')}
    </div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <input class="admin-search" id="admin-chat-msg" placeholder="Send as admin..." style="flex:1">
      <button class="btn btn-cyan" onclick="adminPostChat()">Send</button>
    </div>`;
}
async function adminPostChat(){
  const msg=document.getElementById('admin-chat-msg')?.value.trim();if(!msg)return;
  await db.collection('chat_messages').add({author_id:currentUser.uid,author:'[ADMIN] '+profile.username,text:msg,is_npc:false,role:'admin',created_at:firebase.firestore.FieldValue.serverTimestamp()});
  document.getElementById('admin-chat-msg').value='';
  loadAdminSec('chat');
}
async function deleteMsg(id){
  await db.collection('chat_messages').doc(id).delete();
  loadAdminSec('chat');
}
async function clearAllChat(){
  if(!confirm('Delete ALL chat messages?'))return;
  const snap=await db.collection('chat_messages').get();
  const batch=db.batch();snap.docs.forEach(d=>batch.delete(d.ref));
  await batch.commit();toast('Chat cleared','t-success');loadAdminSec('chat');
}
